# .goreleaser.yaml — Lumen scanner CLI release configuration.
#
# ENT-106: macOS builds are code-signed via Developer ID Application
# (Team T6K5H4JKXF) and notarized via xcrun notarytool (done in release.yml,
# not here, for finer control over cert import + stapling).  Linux builds are
# unsigned .tar.gz + checksums.  Windows remains a stub (LU-5 / EV cert).
#
# Required CI secrets (GitHub repo settings):
#   APPLE_DEVELOPER_ID_APPLICATION  — base64-encoded .p12 certificate
#   APPLE_DEVELOPER_ID_PASSWORD     — passphrase for the .p12
#   APPLE_ID                        — Apple ID email for notarytool
#   APP_SPECIFIC_PW                 — App-specific password for notarytool
#   (Team ID T6K5H4JKXF is a constant — no secret needed)
#
# To test locally: goreleaser release --snapshot --clean
# Note: macOS codesign steps run only in CI (require the cert from secrets).

version: 2

project_name: lumen

before:
  hooks:
    - go mod tidy
    # go generate is intentionally a no-op for releases: the NVD + content
    # blobs are COMMITTED to the repo and the generator (//go:build ignore)
    # is never placed behind //go:generate to prevent network calls during
    # goreleaser's build phase.  See LU4-BUILD-BLUEPRINT.md §7.1.
    - go generate ./...

builds:
  - id: lumen
    main: ./cmd/lumen
    binary: lumen
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.BuiltAt={{.Date}}
    flags:
      - -trimpath

archives:
  - id: lumen-archives
    builds:
      - lumen
    name_template: "lumen_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - NOTICE
      - README.md
      - SCANNER_MANIFEST.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge remote-tracking branch
  groups:
    - title: "New Features"
      regexp: "^feat"
      order: 0
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "Security"
      regexp: "^security"
      order: 2
    - title: Other
      order: 999

release:
  github:
    owner: Qwentrix
    name: lumen
  draft: false
  prerelease: auto
  name_template: "Lumen {{ .Tag }}"

# -------------------------------------------------------------------------
# macOS: codesign binary (ENT-106).
#
# The `signs:` block calls codesign on each darwin binary produced by the
# `lumen` build.  The certificate is imported by the macOS build job in
# release.yml (see the "Import Apple certificate" step) before goreleaser
# runs.  Goreleaser signs, then release.yml notarizes + packages as .pkg
# (xcrun notarytool + pkgbuild + xcrun stapler).
#
# Developer ID: "Developer ID Application: Qwentrix Inc (T6K5H4JKXF)"
# Bundle ID:    com.qwentrix.lumen  (consistent with com.qwentrix.miceliumone.* family)
# Options:      --options runtime  (hardened runtime — required for notarization)
#               --timestamp        (secure timestamp — required for notarization)
#               --force            (allow re-signing snapshot builds)
# -------------------------------------------------------------------------
signs:
  - id: macos-codesign
    cmd: codesign
    args:
      - "--sign"
      - "Developer ID Application: Qwentrix Inc (T6K5H4JKXF)"
      - "--options"
      - "runtime"
      - "--timestamp"
      - "--force"
      - "${artifact}"
    artifacts: binary
    ids:
      - lumen
    if: '{{ eq .Os "darwin" }}'

# -------------------------------------------------------------------------
# Linux: .deb and .rpm packaging via nfpm (deferred to LU-5).
# Linux builds ship as unsigned .tar.gz + checksums.txt for LU-4.
# -------------------------------------------------------------------------
