id: VULN_NO_ASSET_INVENTORY
domain: vulnerabilities
severity: critical
default_weight: 0.95
detect:
  questionnaire:
    - Q-VULN-020 == no_inventory
    - Q-VULN-020 == partial
title: "No authoritative asset inventory"
description_short: "No current, authoritative inventory of hardware, software, and cloud assets exists."
description_long: "Without a complete asset inventory, vulnerability management is blind — you cannot patch, scan, or monitor assets you do not know exist. CIS Control 1 and CIS Control 2 treat hardware and software asset inventory as the foundational prerequisite for all other security controls. Shadow IT, untracked cloud instances, and stale decommission records routinely become the initial vector for breaches."
frameworks:
  - id: "CIS Control 1"
    text: "Inventory and Control of Enterprise Assets"
  - id: "CIS Control 2"
    text: "Inventory and Control of Software Assets"
  - id: "NIST SP 800-53 CM-8"
    text: "System Component Inventory"
  - id: "NIST CSF ID.AM-1"
    text: "Physical devices and systems within the organization are inventoried"
micelium_product:
  - product: Sense
    role: Discovers assets through network telemetry and surfaces unmanaged devices
industry_overlays:
  healthcare:
    weight_multiplier: 1.3
  government:
    weight_multiplier: 1.3
  financial:
    weight_multiplier: 1.2
  manufacturing:
    weight_multiplier: 1.3
  energy:
    weight_multiplier: 1.4
  default:
    weight_multiplier: 1.0
remediation_plain: "Build and maintain a current inventory of all assets — servers, workstations, cloud instances, containers, and network devices. Automate discovery so the inventory updates continuously."
remediation_technical: "Deploy an automated asset discovery solution (e.g., Rumble, AWS Config, Azure Resource Graph, CrowdStrike Asset Graph). Integrate with your CMDB. Set alerts for unregistered assets appearing on the network. Review and reconcile the inventory at least monthly."
