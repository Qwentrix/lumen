id: VULN_NO_SBOM
domain: vulnerabilities
severity: medium
default_weight: 0.45
detect:
  questionnaire:
    - Q-VULN-DD-002 == no
title: "No Software Bill of Materials (SBOM)"
description_short: "Production systems lack an SBOM, preventing rapid CVE impact scoping."
description_long: "Without an SBOM, scoping the blast radius of a new CVE requires manual inventory work that can take days or weeks. US Executive Order 14028 and EU CRA requirements are driving SBOM to become mandatory for software sold to regulated sectors."
frameworks:
  - id: "US EO 14028 §4(e)"
    text: "Providing a purchaser an SBOM for each product"
  - id: "EU Cyber Resilience Act Art. 13"
    text: "Software composition and vulnerability documentation"
micelium_product:
  - product: Share
    role: SBOM sharing and downstream supplier notification
industry_overlays:
  technology:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Generate an SBOM for each product in CycloneDX or SPDX format during your build process and store it alongside each release."
remediation_technical: "Add Syft or CycloneDX Maven/Gradle/npm plugins to CI. Store SBOMs in an artefact store tied to the release SHA. Feed them into a vulnerability correlation tool (Grype, Dependency-Track)."
