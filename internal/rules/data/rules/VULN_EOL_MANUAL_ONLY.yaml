id: VULN_EOL_MANUAL_ONLY
domain: vulnerabilities
severity: low
default_weight: 0.25
detect:
  questionnaire:
    - Q-VULN-DD-014 == manual_monitoring
title: "CVE notification for legacy EOL software relies on manual monitoring only"
description_short: "New CVEs affecting end-of-life software are identified only through manual advisory monitoring, with no automated feed."
description_long: "Manually monitoring for CVEs affecting end-of-life software is inherently unreliable. When vendor patch feeds are inactive, analysts must track fragmented advisory sources — NVD, security researcher disclosures, CERT advisories, and third-party intelligence feeds — manually and on an ad hoc basis. This creates significant coverage risk: newly published CVEs for legacy software may go undetected for extended periods. NIST CSF ID.RA-1 expects vulnerability information to be obtained, documented, and updated continuously, not through periodic manual effort. For EOL systems already carrying elevated risk, the absence of automated CVE notification amplifies exposure further."
frameworks:
  - id: "NIST CSF ID.RA-1"
    text: "Asset vulnerabilities are identified and documented — requires ongoing, not ad hoc, CVE monitoring"
  - id: "NIST SP 800-53 RA-5"
    text: "Vulnerability Monitoring and Scanning — include legacy and EOL systems in monitoring scope"
  - id: "CIS Control 7.6"
    text: "Subscribe to vulnerability notification services, including for legacy and EOL software in production"
micelium_product:
  - product: Sense
    role: Aggregates threat intelligence signals for legacy EOL systems that lack native vendor patch feeds
  - product: Sovera
    role: Tracks CVE exposure status for EOL components as part of compliance evidence records
industry_overlays:
  healthcare:
    weight_multiplier: 1.3
  government:
    weight_multiplier: 1.3
  manufacturing:
    weight_multiplier: 1.3
  energy:
    weight_multiplier: 1.3
  financial:
    weight_multiplier: 1.2
  default:
    weight_multiplier: 1.0
remediation_plain: "Subscribe to automated CVE notification sources that cover your legacy and EOL software. Manual monitoring means you will miss newly published vulnerabilities during the gaps between checks."
remediation_technical: "Subscribe to NIST NVD notification APIs and CISA KEV for CVEs affecting legacy software still in production. Use a third-party threat intelligence platform (Recorded Future, GreyNoise, or equivalent) that maintains coverage of EOL software CVE disclosure. Integrate feed alerts into your ticketing workflow with assigned triage ownership. Where vendor feeds are inactive, add CPE identifiers for EOL software to your NVD watch list."
