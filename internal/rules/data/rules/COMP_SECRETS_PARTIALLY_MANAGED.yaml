id: COMP_SECRETS_PARTIALLY_MANAGED
domain: compliance
severity: medium
default_weight: 0.45
detect:
  questionnaire:
    - Q-COMP-025 == partially_managed
title: "Secrets management is partial — some credentials stored insecurely"
description_short: "Some secrets are managed in a secrets manager but others remain stored in code or config files."
description_long: "Partial secrets management creates exploitable gaps: attackers will find and use the insecurely stored credentials even if others are properly managed. Common patterns include legacy services with hardcoded credentials that were never migrated to the secrets manager, or developer convenience workarounds such as local .env files committed to repositories. Each unmanaged credential is an independent lateral movement opportunity. Compliance frameworks treat secrets management as a binary — all sensitive credentials must be managed, not just the ones that were convenient to migrate."
frameworks:
  - id: "PCI DSS Req 3.7"
    text: "Key management policies and procedures apply to all cryptographic keys and credentials"
  - id: "SOC 2 CC6.1"
    text: "Logical access controls protecting all credentials"
  - id: "NIST SP 800-57"
    text: "Key management lifecycle — applies to all cryptographic material"
micelium_product:
  - product: Sypher
    role: Centralises all key and credential management to eliminate partial-coverage gaps
industry_overlays:
  healthcare:
    weight_multiplier: 1.4
  financial:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.4
  technology:
    weight_multiplier: 1.3
  it_services:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Complete the migration of all credentials to your secrets manager — partial coverage provides partial protection. Audit all services to find anything that was missed."
remediation_technical: "Run a secrets scanning audit (Gitleaks, TruffleHog) across all code repositories to identify unmanaged credentials. Prioritise legacy services and infrastructure-as-code files. Create a migration plan to move remaining hardcoded or config-file credentials to your secrets manager within a defined timeframe. Enforce secrets manager usage through developer guidelines and automated pre-commit checks. Set a target date for zero unmanaged credentials and track progress."
