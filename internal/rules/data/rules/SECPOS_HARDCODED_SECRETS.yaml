id: SECPOS_HARDCODED_SECRETS
domain: security_posture
severity: critical
default_weight: 0.90
detect:
  questionnaire:
    - Q-SECPOS-041 == no_scanning
    - Q-SECPOS-041 == ad_hoc_manual
title: "Hardcoded secrets in source code — no automated scanning to prevent exposure"
description_short: "No secrets scanning in CI/CD pipeline — hardcoded API keys, passwords, and credentials may exist in repositories."
description_long: "Hardcoded secrets in source code are routinely exposed through public repositories, insider leaks, and supply-chain compromises. GitHub's secret-scanning service reports detecting billions of secrets exposed annually. Once a secret is committed to a repository — even briefly — it must be treated as compromised because git history preserves it permanently. Cloud provider API keys, database credentials, and third-party service tokens in code are exploited within minutes of public exposure by automated scanners. AWS report that the vast majority of cloud account compromises involving credential theft originate from exposed secrets in code repositories."
frameworks:
  - id: "NIST CSF PR.PS-02"
    text: "Software is maintained, replaced, and removed commensurate with risk"
  - id: "CIS Control 4.4"
    text: "Use unique passwords and do not embed credentials — secrets must not be hardcoded in source code or configuration files"
  - id: "CIS Control 16.12"
    text: "Implement code-level security — scanning for secrets and vulnerabilities"
  - id: "ISO 27001:2022 A.8.25"
    text: "Secure development lifecycle — credentials not hardcoded"
  - id: "SOC 2 CC8.1"
    text: "Change management — secure code review and testing"
  - id: "FedRAMP SA-11"
    text: "Developer testing and evaluation — security testing including static analysis"
  - id: "CISA Zero Trust Pillar: Applications"
    text: "Secure development practices preventing credential exposure"
micelium_product:
  - product: Sypher
    role: Centralised secrets management providing a secure alternative to hardcoded credentials
  - product: Sovera
    role: Policy enforcement for development practices including secrets hygiene
industry_overlays:
  technology:
    weight_multiplier: 1.4
  financial:
    weight_multiplier: 1.5
  healthcare:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.5
  it_services:
    weight_multiplier: 1.4
  default:
    weight_multiplier: 1.0
remediation_plain: "Add automated secrets scanning to your CI/CD pipeline that blocks code commits and builds when credentials are detected. Migrate any existing hardcoded credentials to a secrets manager immediately and rotate those credentials — assume they are already compromised."
remediation_technical: "Implement pre-commit secrets scanning (git-secrets, detect-secrets, Gitleaks) with developer-local hooks and CI/CD pipeline gating that fails builds on findings. Enable GitHub Advanced Security secret scanning or GitLab Secret Detection for repository-level scanning including historical commit scanning. Audit all existing repositories for historical secrets using Trufflehog or Gitleaks with the --since-commit flag. Rotate every discovered credential immediately — treat all discovered secrets as compromised regardless of exposure history. Enforce secrets manager usage (HashiCorp Vault, AWS Secrets Manager, Azure Key Vault) through developer training and pipeline validation that rejects env-file-based secrets in production containers."
