id: VULN_NO_RED_TEAM
domain: vulnerabilities
severity: medium
default_weight: 0.40
detect:
  questionnaire:
    - Q-VULN-DD-008 == neither
title: "No red team exercises or adversarial simulation — neither internal nor third-party"
description_short: "No red team exercises are conducted — neither internal adversarial simulation nor third-party red teaming."
description_long: "Relying solely on penetration tests without any adversarial simulation (red teaming) leaves the organisation without validated detection and response capabilities. Penetration tests focus on vulnerability identification; red team exercises simulate realistic attack campaigns — including persistence, lateral movement, and data exfiltration — to test whether the organisation's detection and response would actually work. Without red team exercises, an organisation may have theoretical security controls that fail silently under realistic attack conditions. NIST SP 800-53 CA-8 recommends adversarial testing for high-value systems. Financial regulators (FCA, FFIEC), large government agencies, and critical infrastructure operators increasingly mandate or strongly expect red team exercises for organisations of mid-enterprise scale."
frameworks:
  - id: "NIST SP 800-53 CA-8"
    text: "Penetration Testing — conduct adversarial testing including red team exercises for high-value systems"
  - id: "NIST CSF PR.IP-10"
    text: "Response and recovery plans are tested — red team exercises test detection and response capabilities"
  - id: "TIBER-EU"
    text: "Threat Intelligence Based Ethical Red Teaming — red team exercises required for EU financial sector entities"
micelium_product:
  - product: Sense
    role: Provides the detection layer that red team exercises are designed to validate — findings directly improve detection tuning
  - product: Sovera
    role: Tracks red team exercise findings and remediation actions as part of the compliance evidence programme
