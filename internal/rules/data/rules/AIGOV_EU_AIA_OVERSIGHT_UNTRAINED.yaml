id: AIGOV_EU_AIA_OVERSIGHT_UNTRAINED
domain: ai_governance
severity: medium
default_weight: 0.55
detect:
  questionnaire:
    - Q-AIGOV-031 == no_training
    - Q-AIGOV-031 == informal_awareness
title: "Employees using high-risk AI not trained on EU AI Act human-oversight obligations"
description_short: "Staff operating or relying on high-risk AI systems have not received formal training on their human-oversight obligations under the EU AI Act."
description_long: "EU AI Act Art. 26(6) requires deployers of high-risk AI systems to ensure that personnel responsible for oversight have the necessary competence, training, and authority. Informal awareness briefings do not meet this requirement because they leave no documented evidence of training completion, and awareness is not the same as competence. Human oversight is a cornerstone obligation of the EU AI Act for high-risk systems — specifically, the requirement that designated personnel are able to interpret the AI system's outputs, understand when to override, and know how to report concerns. Without formal training with completion records, the organisation cannot demonstrate to a supervisory authority that it has met this obligation, and employees do not have the structured knowledge needed to fulfil the oversight role effectively."
frameworks:
  - id: "EU AI Act Art. 26(6)"
    text: "Deployers shall ensure persons assigned to oversee high-risk AI systems have the necessary competence and training"
  - id: "EU AI Act Art. 4"
    text: "AI literacy — deployers shall take measures to ensure sufficient AI literacy for their personnel"
  - id: "NIST AI RMF GOVERN-5.2"
    text: "Organisational teams have access to AI risk management resources, including training appropriate to their role"
  - id: "ISO 42001 A.7.2"
    text: "AI awareness and training — personnel shall be trained on AI system operation and risk relevant to their function"
micelium_product:
  - product: Sigil
    role: Provides role-based AI oversight training content tied to specific AI systems in the registry, with completion tracking and re-training triggers on system changes
  - product: Proof
    role: Records training completion with policy version, timestamps, and employee acknowledgement for EU AI Act Art. 26(6) audit evidence
industry_overlays:
  healthcare:
    weight_multiplier: 1.5
  financial:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.5
  legal:
    weight_multiplier: 1.4
  education:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Train every employee who uses or oversees a high-risk AI system on their oversight responsibilities — specifically what to look for, when to flag concerns, and how to override the AI. Keep a record of who completed the training."
remediation_technical: "Develop a formal AI oversight training programme for each high-risk AI system covering: (1) system capabilities and intended purpose; (2) known limitations and failure modes; (3) specific indicators that should trigger human review or override; (4) override procedure — how to intervene and document the action; (5) escalation and reporting path for suspected AI errors. Deliver training to all personnel with oversight roles before they begin using the system. Record completion digitally with employee identity, training version, and timestamp. Define a re-training trigger when the AI system changes materially. Align to EU AI Act Art. 26(6) competence and Art. 4 AI literacy requirements."
