remediation_plain: "Having a retention policy is only useful if data is actually deleted when the schedule says it should be. Implement automated deletion jobs that run without manual intervention, and make sure backups are included — data in backups is still personal data."
remediation_technical: "1. Implement automated retention enforcement jobs: scheduled processes that delete or anonymize personal data when retention periods expire, without requiring manual initiation. 2. Ensure backup retention schedules align with primary data retention: configure backup lifecycle policies to delete backup data at primary retention expiry. 3. Include retention enforcement in DPAs: require processors to confirm deletion of personal data within 30 days of retention expiry or contract termination. 4. Implement retention enforcement monitoring: track which data categories have had retention jobs run and verify completeness. 5. Where automated deletion is not technically feasible for some systems, implement compensating controls: access revocation at retention expiry (cryptographic erasure or DRM access expiry). 6. Audit retention enforcement annually: sample data to verify records past their retention date have been deleted."
