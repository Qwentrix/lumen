id: VULN_SLOW_CRITICAL_PATCH
domain: vulnerabilities
severity: critical
default_weight: 0.9
detect:
  questionnaire:
    - Q-VULN-DD-001 == over_month
  scanner:
    - vulnerabilities.critical_cve_count > 0
title: "Critical patches applied in over a month"
description_short: "CVSS >= 9.0 vulnerabilities take more than a month to patch."
description_long: "Critical CVEs are weaponised within hours to days of public disclosure. A patching lag exceeding one month provides attackers a sustained window to exploit known vulnerabilities. This is among the most easily measured and most consequential compliance failures."
frameworks:
  - id: "NIST CSF RS.MI-3"
    text: "Newly identified vulnerabilities are mitigated or documented as accepted risks"
  - id: "PCI DSS Req 6.3.3"
    text: "All system components are protected from known vulnerabilities by installing applicable security patches"
micelium_product:
  - product: Sense
    role: Detects exploitation attempts on unpatched systems
industry_overlays:
  financial:
    weight_multiplier: 1.4
  healthcare:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Define SLA tiers: critical (CVSS >= 9) must be patched within 24 hours; high (CVSS 7–8.9) within 7 days."
remediation_technical: "Integrate your vulnerability scanner with a change management system. Automate emergency change paths for critical CVEs. Track SLA compliance metrics in a dashboard."
