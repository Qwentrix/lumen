remediation_plain: "For every cross-border transfer to a country without an EU adequacy decision, assess whether that country's laws would allow its government to access the data you are transferring. If the answer is yes and you cannot implement supplementary measures to prevent it, the transfer may not be lawful."
remediation_technical: "1. For each existing SCC-covered transfer, conduct a TIA following the EDPB 3-step framework: (a) assess the transfer, (b) assess the recipient country's legal framework for government access, (c) determine whether the SCC protections are effective in practice. 2. Document the TIA per the 2021 SCCs Clause 14 requirements: parties' representation of knowledge of recipient country law, assessment of whether laws impinge on SCC effectiveness. 3. Where TIA identifies risks: implement supplementary measures — end-to-end encryption with key custody outside the recipient country is the primary recommended technical measure. 4. Where supplementary measures cannot eliminate the risk: consider whether the transfer should proceed and document the risk acceptance or transfer suspension decision. 5. Review TIAs when recipient country law changes (e.g., US FISA reauthorizations, new surveillance legislation)."
