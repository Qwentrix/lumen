id: VULN_CLOUD_IAM_INFREQUENT
domain: vulnerabilities
severity: medium
default_weight: 0.45
detect:
  questionnaire:
    - Q-VULN-018 == ad_hoc
title: "Cloud IAM permissions reviewed only ad hoc — no defined schedule"
description_short: "Cloud IAM entitlements are reviewed only when an issue is suspected, leaving over-privileged accounts undetected."
description_long: "Ad hoc IAM reviews mean that over-privileged accounts and service roles accumulate undetected between reviews. Cloud environments accrete permissions over time: developers request elevated access during incidents, service roles are cloned with excessive permissions, and temporary access grants are never revoked. Without a defined review cadence, the blast radius of a compromised credential continuously grows. NIST SP 800-53 AC-6 (Least Privilege) and the CIS Cloud Foundations Benchmark both require regular entitlement reviews. SOC 2 and ISO 27001 access control clauses expect periodic access reviews on a documented schedule."
frameworks:
  - id: "NIST SP 800-53 AC-6"
    text: "Least privilege — review and enforce minimum necessary permissions"
  - id: "CIS Cloud Foundations Benchmark"
    text: "Regularly review and remove unnecessary IAM permissions"
  - id: "ISO 27001 A.9.2.5"
    text: "Review of user access rights on a regular basis"
micelium_product:
  - product: Sense
    role: Identifies anomalous API calls from over-privileged cloud identities indicating credential misuse
  - product: Sovera
    role: Provides access review workflow evidence for compliance reporting
industry_overlays:
  financial:
    weight_multiplier: 1.4
  healthcare:
    weight_multiplier: 1.3
  government:
    weight_multiplier: 1.3
  technology:
    weight_multiplier: 1.2
  it_services:
    weight_multiplier: 1.2
  retail:
    weight_multiplier: 1.2
  default:
    weight_multiplier: 1.0
remediation_plain: "Establish a quarterly IAM access review schedule. Move to automated entitlement analysis tools so over-privileged accounts and stale permissions are flagged proactively, not just when a breach forces the question."
remediation_technical: "Implement automated IAM analysis (AWS IAM Access Analyzer, GCP Policy Analyzer, Azure Access Review, or a third-party CIEM tool). Schedule quarterly reviews with documented sign-off. Enable SCPs or IAM permission boundaries to enforce least privilege at the account or project level. Rotate and deactivate unused service account keys on a defined schedule."
