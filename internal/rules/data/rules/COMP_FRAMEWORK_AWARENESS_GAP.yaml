id: COMP_FRAMEWORK_AWARENESS_GAP
domain: compliance
severity: medium
default_weight: 0.45
detect:
  questionnaire:
    - Q-COMP-004 == unsure
title: "Applicable compliance frameworks are not identified"
description_short: "The organisation is unsure which compliance frameworks apply to its operations, indicating a foundational gap in compliance programme awareness."
description_long: "Uncertainty about which compliance frameworks apply is not a neutral position — it means the organisation may be subject to regulatory obligations it is not meeting. Healthcare organisations that handle PHI are subject to HIPAA regardless of whether they have identified it. Organisations processing EU personal data are subject to GDPR regardless of their awareness. Organisations that take payment cards are subject to PCI DSS. Ignorance of applicable frameworks does not exempt an organisation from enforcement. This gap also means the organisation has no basis for prioritising security investments, no framework for assessing its current controls, and no compliance programme at all. A framework identification exercise is the prerequisite to any other compliance activity."
frameworks:
  - id: "ISO 27001 Clause 4.1"
    text: "Understanding the organisation and its context — determining issues relevant to information security"
  - id: "ISO 27001 Clause 4.2"
    text: "Understanding the needs and expectations of interested parties including regulators"
  - id: "NIST CSF ID.GV-3"
    text: "Legal and regulatory requirements regarding cybersecurity are understood and managed"
micelium_product:
  - product: Sovera
    role: Maps the organisation's data types, geographies, and industry to applicable compliance frameworks
  - product: Proof
    role: Provides a framework library and applicability assessment workflow
industry_overlays:
  healthcare:
    weight_multiplier: 1.4
  financial:
    weight_multiplier: 1.3
  retail:
    weight_multiplier: 1.2
  technology:
    weight_multiplier: 1.1
  default:
    weight_multiplier: 1.0
remediation_plain: "Determine which compliance frameworks apply to your organisation by considering the type of data you handle, where your customers are located, your industry sector, and any contractual requirements from customers or partners."
remediation_technical: "Conduct a regulatory applicability assessment: (1) Catalogue data types processed (PHI, PII, PCI CHD, CUI, EU personal data). (2) Identify applicable jurisdictions. (3) Map to mandatory frameworks (HIPAA, GDPR, PCI DSS) and contractual frameworks (SOC 2, ISO 27001, FedRAMP). (4) Document applicability decisions with rationale. (5) Assign a framework owner for each applicable framework. Engage legal counsel for regulatory determination in complex multi-jurisdiction scenarios."
