id: VULN_SECRETS_SCAN_NOT_ENFORCED
domain: vulnerabilities
severity: medium
default_weight: 0.45
detect:
  questionnaire:
    - Q-VULN-027 == ad_hoc_only
title: "Secrets scanning exists but is not enforced in CI/CD"
description_short: "Secrets scanning is performed only ad hoc — not enforced as an automated gate in the development pipeline."
description_long: "Ad hoc or manual secrets scanning provides a false sense of security: commits between scan runs are unvalidated, and human discipline cannot match the volume and velocity of modern development workflows. Enforcement — pre-commit hooks that block secrets and CI pipeline checks that fail builds — is what converts secrets scanning from a point-in-time review into a continuous control. NIST SP 800-218 and security engineering best practice require secrets detection to be an automated, policy-enforced gate."
frameworks:
  - id: "NIST SP 800-218 SSDF PW.7.1"
    text: "Automated enforcement of credential-free code"
  - id: "CIS Software Supply Chain Security Guide"
    text: "Pre-commit and CI pipeline secrets enforcement"
micelium_product:
  - product: Sypher
    role: Provides secrets lifecycle management so that any leaked credential can be rapidly rotated
industry_overlays:
  technology:
    weight_multiplier: 1.4
  it_services:
    weight_multiplier: 1.4
  financial:
    weight_multiplier: 1.3
  healthcare:
    weight_multiplier: 1.2
  government:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Automate secrets scanning by adding pre-commit hooks and a mandatory CI pipeline step — ad hoc scanning is not sufficient for a developer team with continuous commits."
remediation_technical: "Add Gitleaks or TruffleHog as a pre-commit hook (via pre-commit framework) and as a required CI check. Configure the CI check to block merges when secrets are detected. Enable GitHub push protection or GitLab push rules for native enforcement. Establish a runbook for responding to a detected leaked secret (rotate, audit usage, notify if required)."
