remediation_plain: "Decide how long you need each type of personal data and write it down. Once the retention period expires, delete the data. Keeping personal data forever 'just in case' is both a legal risk and a breach-impact multiplier."
remediation_technical: "1. Conduct a data type inventory and for each type, determine: the lawful retention period (regulatory minimum, contractual requirement, or business necessity with documented justification). 2. Document retention schedules in a retention policy covering all data categories: customer PII, employee data, financial records, health data, logs and analytics. 3. Differentiate schedules by jurisdiction where required (EU GDPR storage limitation vs. US regulatory retention minimums may conflict — document the longer legally required period with the basis). 4. Include retention schedules in the Art. 30 ROPA per Art. 30(1)(f). 5. Implement automated deletion or anonymization jobs triggered at retention expiry. 6. Review retention schedules annually and whenever processing purposes change."
