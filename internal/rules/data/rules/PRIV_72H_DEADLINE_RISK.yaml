remediation_plain: "Build and test a breach notification playbook that includes: a severity triage checklist, pre-approved notification templates for supervisory authorities and data subjects, and a contact list for every jurisdiction where you process personal data. Run at least one tabletop exercise annually to verify you can execute within 72 hours."
remediation_technical: "1. Document breach severity tiers mapped to GDPR Art. 33 notification thresholds. 2. Maintain per-jurisdiction supervisory authority contacts (ICO, CNIL, BfDI, etc.) with submission portal URLs. 3. Draft and legally approve notification templates for both SA and data-subject communications. 4. Integrate breach detection tooling with a workflow system that auto-triggers the notification runbook. 5. Run annual tabletop exercises simulating breach scenarios with time-bounded decision gates. 6. Store all templates and contacts in a location accessible during an incident (not solely in SIEM or IR tooling that may itself be compromised)."
