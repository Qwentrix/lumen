id: PRIV_72H_DEADLINE_RISK
domain: privacy
severity: high
default_weight: 0.80
detect:
  questionnaire:
    - Q-PRIV-037 == no_assessment
    - Q-PRIV-039 == never_tested
    - Q-PRIV-DD-037 == no_template
    - Q-PRIV-DD-038 == no
    - Q-PRIV-DD-038 == primary_jurisdiction_only
title: "Breach notification process unlikely to meet 72-hour GDPR deadline"
description_short: "The organization lacks a tested, template-ready breach notification process that can reliably meet GDPR's 72-hour supervisory-authority reporting window."
description_long: "GDPR Art. 33 requires notification to the supervisory authority within 72 hours of becoming aware of a personal-data breach. Without a tested severity-assessment framework, pre-drafted notification templates, and maintained supervisory-authority contact lists per jurisdiction, organizations routinely miss this window. HIPAA's Breach Notification Rule (45 CFR §164.400–414) requires covered entities to notify affected individuals within 60 days of discovery. CCPA §1798.150 triggers civil liability for unreasonable delays. Missing these deadlines is separately prosecutable from the underlying breach and results in enhanced regulatory scrutiny."
frameworks:
  - id: "GDPR Art. 33"
    text: "Notification to supervisory authority within 72 hours of breach awareness"
  - id: "GDPR Art. 34"
    text: "Communication of breach to data subjects without undue delay"
  - id: "HIPAA 45 CFR §164.400–414"
    text: "HIPAA Breach Notification Rule — 60-day notification requirement for covered entities"
  - id: "CCPA §1798.150"
    text: "Private right of action for unreasonable delay in breach notification"
  - id: "ISO 27018 §9.3"
    text: "Breach notification obligations for cloud service providers handling personal data"
  - id: "NIST Privacy Framework RS.CO-1"
    text: "Response communications are coordinated and shared with appropriate stakeholders"
micelium_product:
  - product: Proof
    role: Maintains pre-drafted breach notification templates, supervisory authority contacts, and evidence artefacts to accelerate 72-hour response
  - product: Pulse
    role: Automates breach workflow escalation and tracks time-to-notification against regulatory deadlines
  - product: Sense
    role: Reduces mean time to detection, widening the operational window available before the 72-hour clock expires
