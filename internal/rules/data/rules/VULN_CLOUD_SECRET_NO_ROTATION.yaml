id: VULN_CLOUD_SECRET_NO_ROTATION
domain: vulnerabilities
severity: medium
default_weight: 0.50
detect:
  questionnaire:
    - Q-VULN-DD-020 == env_vars_only
title: "Cloud secrets stored in environment variables without rotation or secrets manager"
description_short: "Cloud API keys and credentials are stored in environment variables with no secrets manager and no rotation enforcement."
description_long: "Storing cloud credentials exclusively in environment variables provides no rotation mechanism, no audit trail, and no centralised visibility into which credentials exist and when they were last changed. Environment variables can leak through application error logs, debug endpoints, process listings, and container image layers. Without a secrets manager, there is no automated rotation, no expiry enforcement, and no centralised revocation capability if a credential is compromised. NIST SP 800-53 IA-5 requires credential lifecycle management including periodic rotation. The absence of rotation means a single credential compromise can persist indefinitely without detection."
frameworks:
  - id: "NIST SP 800-53 IA-5"
    text: "Authenticator Management — enforce credential rotation and protect authenticators throughout their lifecycle"
  - id: "CIS Control 4.4"
    text: "Use unique passwords and enforce credential rotation — environment variables are not a secrets manager"
  - id: "PCI DSS Req 8.6"
    text: "System and application accounts must be managed by policies including rotation"
micelium_product:
  - product: Ark
    role: Provides key management and secret rotation capabilities as an alternative to static environment variables
  - product: Sypher
    role: Manages encryption credentials lifecycle to replace static environment variable patterns
  - product: Sense
    role: Detects anomalous API usage that may indicate leaked environment variable credentials
industry_overlays:
  financial:
    weight_multiplier: 1.4
  healthcare:
    weight_multiplier: 1.3
  government:
    weight_multiplier: 1.3
  technology:
    weight_multiplier: 1.3
  it_services:
    weight_multiplier: 1.2
  retail:
    weight_multiplier: 1.2
  default:
    weight_multiplier: 1.0
remediation_plain: "Migrate credentials from environment variables to a dedicated secrets manager. This gives you rotation, audit logging, and the ability to revoke a single credential without touching your application code."
remediation_technical: "Migrate secrets from environment variables to a managed secrets store (AWS Secrets Manager, HashiCorp Vault, Azure Key Vault, or GCP Secret Manager). Enable automatic rotation for long-lived credentials. Replace static access keys with instance roles, workload identity, or OIDC federation where possible — this eliminates the credential entirely. Enable audit logging on secret access to detect unauthorized reads."
