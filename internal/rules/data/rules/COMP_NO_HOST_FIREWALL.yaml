id: COMP_NO_HOST_FIREWALL
domain: compliance
severity: high
default_weight: 0.60
detect:
  scanner:
    - compliance.firewall_enabled == false
title: "Host firewall disabled on endpoint"
description_short: "The operating system's host-based firewall is turned off, leaving local services exposed to any reachable network."
description_long: "A host-based firewall is the last line of defence for an endpoint once an attacker reaches the same network segment — a hostile coffee-shop Wi-Fi, a compromised peer on the corporate LAN, or a pivot from another breached host. With the host firewall disabled, every listening service on the device is directly reachable, turning a single exposed daemon into a remote-exploitation foothold. Host-based firewalls on end-user devices are explicitly required by CIS Controls v8 4.5 and NIST 800-53 SC-7, and they are a baseline expectation under PCI DSS for any computing device that connects to both untrusted networks and the cardholder data environment. Their absence is one of the fastest findings to surface in an endpoint posture assessment."
frameworks:
  - id: "CIS Controls v8 4.5"
    text: "Implement and manage a host-based firewall or port-filtering tool on end-user devices"
  - id: "NIST 800-53 SC-7"
    text: "Boundary protection — monitor and control communications at external and key internal boundaries"
  - id: "PCI DSS Req 1.5"
    text: "Risks to the cardholder data environment from computing devices that connect to both untrusted networks and the CDE are mitigated"
  - id: "ISO 27001:2022 A.8.20"
    text: "Network security — securing networks and network devices"
micelium_product:
  - product: Sovera
    role: Policy-as-code governance enforces a host-firewall-enabled baseline and flags any device that deviates
  - product: Sense
    role: Endpoint posture and behavioural monitoring detects when local protection is disabled or tampered with
industry_overlays:
  financial:
    weight_multiplier: 1.4
  healthcare:
    weight_multiplier: 1.3
  government:
    weight_multiplier: 1.4
  energy:
    weight_multiplier: 1.4
  retail:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Turn the operating system's built-in firewall back on for every laptop and workstation, and prevent users from disabling it. On macOS enable the Application Firewall; on Linux enable ufw or firewalld; on Windows keep Windows Defender Firewall on for all profiles."
remediation_technical: "Enforce host firewall state through device management (MDM/Intune/Jamf) so the setting cannot be disabled by end users. macOS: enable the Application Firewall via 'socketfilterfw --setglobalstate on' and set the configuration profile firewall payload to enforced. Linux: 'ufw enable' (Debian/Ubuntu) or 'systemctl enable --now firewalld' (RHEL) with a default-deny inbound policy. Windows: set Defender Firewall to On for Domain, Private, and Public profiles via Group Policy. Monitor firewall state continuously and alert on any transition to disabled."
