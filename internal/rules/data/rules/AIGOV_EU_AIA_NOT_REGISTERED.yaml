id: AIGOV_EU_AIA_NOT_REGISTERED
domain: ai_governance
severity: high
default_weight: 0.70
detect:
  questionnaire:
    - Q-AIGOV-DD-029 == no_process
    - Q-AIGOV-DD-029 == aware_not_yet_registered
title: "High-risk AI systems not registered in EU AI Act public database — Art. 49 obligation unmet"
description_short: "High-risk AI systems requiring registration under EU AI Act Art. 49 have not been entered in the EU AI Act public database."
description_long: "EU AI Act Art. 49 requires providers and certain deployers of high-risk AI systems listed in Annex III to register their systems in the EU AI Act public database before placing them on the market or putting them into service. This registration requirement is a transparency and accountability mechanism that enables supervisory authorities, affected persons, and the public to understand which AI systems are in use in regulated contexts. Non-registration is a direct legal violation that can result in penalties up to €15 million or 3% of global annual turnover under Art. 99. Awareness of the obligation without action represents willful non-compliance, which supervisory authorities treat as an aggravating factor. The registration process also creates a trigger for reviewing completeness of the broader EU AI Act compliance posture because it requires providing information that may not yet exist."
frameworks:
  - id: "EU AI Act Art. 49"
    text: "Registration — providers and certain deployers of high-risk AI systems must register systems in the EU AI Act public database"
  - id: "EU AI Act Art. 99"
    text: "Penalties — non-registration can result in fines up to €15 million or 3% of global annual turnover"
  - id: "EU AI Act Art. 74"
    text: "Market surveillance of AI systems — authorities may investigate, audit, and enforce compliance including registration obligations"
  - id: "EU AI Act Annex III"
    text: "High-risk AI system categories subject to the registration requirement"
micelium_product:
  - product: Sigil
    role: Tracks registration status for each high-risk AI system in the registry, provides pre-populated registration data from the technical documentation package, and alerts on missing registrations
  - product: Sovera
    role: Maps AI systems against Annex III registration obligations and generates compliance status reports for legal counsel review
industry_overlays:
  healthcare:
    weight_multiplier: 1.5
  financial:
    weight_multiplier: 1.5
  government:
    weight_multiplier: 1.5
  legal:
    weight_multiplier: 1.4
  education:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Register your high-risk AI systems in the EU AI Act public database. If you are not sure which systems require registration, get legal advice now — the penalties for non-compliance are significant."
remediation_technical: "Engage legal counsel to confirm which deployed AI systems require registration under Art. 49 based on the Annex III classification review. For each system requiring registration: (1) ensure the Art. 11 technical documentation package is complete — registration requires this information; (2) complete registration in the EU AI Act public database at https://ai-office.ec.europa.eu; (3) document registration confirmation and reference numbers in the AI risk register; (4) establish a process to screen all new AI system deployments against the Art. 49 registration requirement before going live. Set a review trigger to verify continued registration validity when significant changes are made to registered systems."
