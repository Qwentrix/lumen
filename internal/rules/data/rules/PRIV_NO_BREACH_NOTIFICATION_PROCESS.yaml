remediation_plain: "Create a written breach notification playbook before you need it. It should tell your team exactly how to recognize a breach, who to call, how to assess severity, who drafts the regulatory notification, and where to send it — all within 72 hours."
remediation_technical: "1. Document a breach notification procedure covering: breach detection triggers, initial containment steps, severity assessment framework, internal escalation chain, supervisory authority notification templates and submission contacts per jurisdiction, data subject notification templates, and media notification procedures for HIPAA large-breach scenarios. 2. Integrate the breach notification procedure with the incident response plan — personal data involvement should be a mandatory triage question in every security incident. 3. Train all employees on breach recognition and escalation; conduct role-specific training for IT, legal, and customer-facing teams. 4. Test the procedure annually via tabletop exercise with a time-bounded scenario. 5. Maintain the procedure as a living document, updated when new jurisdictions come into scope or regulations change."
