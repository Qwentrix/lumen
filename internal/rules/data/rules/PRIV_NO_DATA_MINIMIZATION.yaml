remediation_plain: "Review what personal data you collect for each processing purpose and ask whether each field is genuinely necessary. If you can achieve the purpose without collecting a data element, do not collect it. Make data minimization a formal checkpoint in product and feature design."
remediation_technical: "1. Conduct a data field necessity audit: for each processing activity, list all personal data fields collected and document the specific necessity justification for each. Remove or stop collecting fields that lack a necessity justification. 2. Implement a privacy-by-design checklist as a gate in the product development lifecycle — data field collection decisions must be reviewed before development begins. 3. Implement data minimization at the API and form layer: do not transmit or store fields that are not needed for the immediate processing purpose. 4. Apply attribute-based access control so analytics, marketing, and processing systems receive only the fields they need — not a full user record. 5. Review data minimization compliance as part of the annual ROPA review and DPIA process."
