id: AIGOV_AI_DATA_AUDIT_GAP
domain: ai_governance
severity: medium
default_weight: 0.55
detect:
  questionnaire:
    - Q-AIGOV-022 == no_monitoring
    - Q-AIGOV-022 == logging_no_alerting
  scanner:
    - ai_governance.llm_egress_processes_count > 0
    - ai_governance.mcp_servers_running > 0
    - Q-AIGOV-039 == no_logging
    - Q-AIGOV-039 == partial_logging
    - Q-AIGOV-053 == separate_not_linked
    - Q-AIGOV-DD-019 == logging_not_implemented
    - Q-AIGOV-DD-019 == metadata_only
    - Q-AIGOV-DD-020 == no_process
    - Q-AIGOV-DD-038 == inventory_exists_not_linked
    - Q-AIGOV-DD-042 == general_security_taxonomy
title: "No audit trail for AI data submissions — AI egress logging absent or incomplete"
description_short: "AI tool usage is not logged with sufficient detail to support post-incident investigation or compliance audit."
description_long: "When AI data submissions are not logged — or logged with only metadata without content context — the organisation cannot answer critical questions after an incident: what data was submitted, by whom, to which AI service, and when? This gap makes it impossible to scope a data breach notification obligation accurately, to satisfy regulatory audit requests, or to reconstruct the timeline of an AI-related incident. EU AI Act Art. 12 requires logging for high-risk AI systems and operators must retain logs. GDPR Art. 33 requires that organisations be able to describe the nature of a personal data breach — without AI audit logs, breach scoping is speculative. NIST AI RMF MEASURE-2.5 requires continuous monitoring of AI system behaviour. The absence of AI-specific logging also means that anomalous bulk-data submissions to AI services may go undetected for extended periods."
frameworks:
  - id: "EU AI Act Art. 12"
    text: "Logging capabilities — deployers of high-risk AI systems must retain logs generated by the system"
  - id: "GDPR Art. 33"
    text: "Notification of personal data breach — requires ability to characterise what data was involved; AI logs are essential evidence"
  - id: "NIST AI RMF MEASURE-2.5"
    text: "AI system operation is monitored for data and performance drift — requires logging as prerequisite"
  - id: "ISO 42001 A.9.4"
    text: "Logging and monitoring of AI systems — events related to AI system operation shall be recorded"
micelium_product:
  - product: Sigil
    role: Provides a structured audit log of all AI agent actions and API submissions with user attribution, data classification, and tamper-evident storage
  - product: Sense
    role: Correlates AI usage logs with behavioural baselines to surface anomalous submission volumes as SIEM alerts
  - product: Proof
    role: Exports AI audit logs in compliance-ready formats for regulatory investigations and breach scoping
industry_overlays:
  healthcare:
    weight_multiplier: 1.5
  financial:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.4
  legal:
    weight_multiplier: 1.4
  technology:
    weight_multiplier: 1.2
  default:
    weight_multiplier: 1.0
remediation_plain: "Start logging who uses which AI tools, what kind of data they submit, and when. Make sure these logs are stored securely and kept long enough that you can use them during an investigation."
remediation_technical: "Implement structured AI usage logging capturing: user identity, timestamp, AI service endpoint, content classification or hash of submitted data, response metadata (but not response content unless required). Route logs to a SIEM or centralised log management system. Set retention to match applicable regulatory minimums (HIPAA: 6 years; GDPR: incident-linked; EU AI Act high-risk: defined by national implementation). Define anomaly detection rules for volume spikes and high-sensitivity classification submissions. Link AI model inventory entries to log sources so incident responders can query by system."
