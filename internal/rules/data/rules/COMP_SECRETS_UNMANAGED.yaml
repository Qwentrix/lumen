id: COMP_SECRETS_UNMANAGED
domain: compliance
severity: critical
default_weight: 0.90
detect:
  questionnaire:
    - Q-COMP-025 == hardcoded_or_shared
    - Q-COMP-025 == no_process
title: "Encryption keys and secrets stored in code or config files"
description_short: "Encryption keys, API keys, and credentials are hardcoded in code or config files with no secrets management."
description_long: "Hardcoded or informally shared credentials are among the top root causes of cloud and application breaches. Once a secret is committed to code or stored in a config file without access controls, it is accessible to anyone with code access, visible in CI/CD logs, and often leaked through accidental repository exposure. PCI DSS Req 3.7, SOC 2 CC6.1, and HIPAA access control requirements all require that access credentials be properly managed. The absence of a secrets manager means there is no rotation, no audit log of access, and no ability to revoke a specific credential rapidly during an incident."
frameworks:
  - id: "PCI DSS Req 3.7"
    text: "Cryptographic keys and credentials — key management procedures"
  - id: "SOC 2 CC6.1"
    text: "Logical and physical access controls protecting credentials"
  - id: "HIPAA 164.312(d)"
    text: "Person or entity authentication — credential management"
  - id: "NIST SP 800-57"
    text: "Recommendation for Key Management"
  - id: "OWASP Top 10 A07:2021"
    text: "Identification and Authentication Failures — credential hygiene"
micelium_product:
  - product: Sypher
    role: Provides centralised key and secrets management with rotation and audit trail
industry_overlays:
  healthcare:
    weight_multiplier: 1.5
  financial:
    weight_multiplier: 1.5
  government:
    weight_multiplier: 1.5
  technology:
    weight_multiplier: 1.4
  it_services:
    weight_multiplier: 1.4
  retail:
    weight_multiplier: 1.4
  default:
    weight_multiplier: 1.0
remediation_plain: "Move all credentials, API keys, and encryption keys into a dedicated secrets manager immediately. Never store them in code, config files, or environment variables committed to source control."
remediation_technical: "Migrate all credentials to HashiCorp Vault, AWS Secrets Manager, Azure Key Vault, or Google Cloud Secret Manager. Enable automatic secret rotation for database credentials and API keys. Set up audit logging for all secret access. Run a secrets scanning pass over all repositories to identify and rotate any leaked credentials. Revoke and reissue all secrets that were hardcoded or stored insecurely."
