id: COMP_NO_DATA_RETENTION
domain: compliance
severity: medium
default_weight: 0.5
detect:
  questionnaire:
    - Q-COMP-DD-002 == no
title: "No data retention and disposal policy"
description_short: "No documented process for retaining and securely disposing of data."
description_long: "Retaining data longer than necessary increases breach impact, regulatory exposure, and storage costs. GDPR Article 5(1)(e) mandates storage limitation. Without a policy, data may be held indefinitely or disposed of without secure erasure."
frameworks:
  - id: "GDPR Art. 5(1)(e)"
    text: "Storage limitation principle"
  - id: "HIPAA 164.310(d)(2)"
    text: "Disposal of electronic media"
  - id: "NIST SP 800-88"
    text: "Guidelines for media sanitisation"
micelium_product:
  - product: Sypher
    role: Cryptographic erasure for data at rest supporting retention enforcement
industry_overlays:
  healthcare:
    weight_multiplier: 1.4
  legal:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Define retention periods per data category and implement automated deletion or archiving. Document the disposal process for physical and digital media."
remediation_technical: "Map data categories to legal retention requirements. Automate deletion via scheduled jobs or lifecycle policies (AWS S3 Object Lifecycle, database TTL). Use Micelium Sypher cryptographic erasure for key-managed data."
