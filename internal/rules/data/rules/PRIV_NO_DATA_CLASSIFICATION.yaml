id: PRIV_NO_DATA_CLASSIFICATION
domain: privacy
severity: high
default_weight: 0.75
detect:
  questionnaire:
    - Q-PRIV-007 == no
    - Q-PRIV-007 == yes_informal
    - Q-PRIV-DD-006 == no_integration
title: "No formal data classification — personal data sensitivity not systematically identified or enforced"
description_short: "Personal data is not classified by sensitivity category (PII, PHI, special-category, financial), or classification exists informally but is not technically enforced in access controls or data protection measures."
description_long: "Data classification is foundational to privacy protection: you cannot apply appropriate safeguards to data whose sensitivity you have not identified. GDPR Art. 9 imposes stricter obligations on special-category data (health, biometric, racial origin, etc.) that require elevated consent or other lawful bases, specific security measures, and DPIA requirements. Without classification, organizations routinely apply the same (often insufficient) protection to all data, leading to under-protection of the most sensitive categories. Where classification exists informally but is not integrated with access controls (Q-PRIV-DD-006 == no_integration), the classification is decorative rather than protective. HIPAA requires covered entities to identify and protect all ePHI — not just data someone thought to mark as sensitive. NIST Privacy Framework PR.ID-2 specifically requires a data inventory that includes sensitivity classification."
frameworks:
  - id: "GDPR Art. 9"
    text: "Special categories of personal data — stricter processing requirements for health, biometric, and other sensitive data"
  - id: "GDPR Art. 32"
    text: "Security of processing — appropriate measures must account for the nature and sensitivity of the data"
  - id: "HIPAA 45 CFR §164.514"
    text: "De-identification of PHI — requires knowing which data is PHI before it can be de-identified or protected"
  - id: "CCPA §1798.121"
    text: "Sensitive personal information — opt-in consent required for certain sensitive categories"
  - id: "ISO 27018 §5.1"
    text: "Personal data classification in cloud environments — classification informs protective measures"
  - id: "NIST Privacy Framework PR.ID-2"
    text: "Data is categorized by sensitivity to guide appropriate privacy protections"
micelium_product:
  - product: Sypher
    role: Automates data classification using content inspection and ML-driven sensitivity labeling, enforcing protection levels based on classification
  - product: Sense
    role: Monitors access patterns on classified data categories, detecting anomalous access to high-sensitivity data
  - product: Sovera
    role: Maps data classifications to jurisdictional residency obligations, ensuring special-category data receives appropriate geographic controls
