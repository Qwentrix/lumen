remediation_plain: "Define a data classification taxonomy that identifies at minimum: public, internal, personal data (PII), sensitive personal data (PHI, financial, biometric, special-category), and confidential. Apply classification labels to all data stores and ensure the label drives the security controls applied to that data."
remediation_technical: "1. Define a classification taxonomy covering at minimum: public, internal, PII (GDPR personal data), special-category personal data (GDPR Art. 9 / HIPAA PHI / CCPA sensitive), and confidential. 2. Implement automated classification tooling (DSPM, DLP) to scan existing data stores and apply labels. 3. Integrate classification labels with access control policy: special-category data requires stricter access rules (e.g., need-to-know, MFA). 4. Integrate classification with DRM: labels applied to documents determine who can open, copy, share, or print. 5. Add classification as a mandatory gate in new data store provisioning and product design reviews. 6. Train all employees handling personal data on the classification taxonomy and their obligations for each tier."
