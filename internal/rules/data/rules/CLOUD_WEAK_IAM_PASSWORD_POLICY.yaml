id: CLOUD_WEAK_IAM_PASSWORD_POLICY
domain: compliance
severity: medium
default_weight: 0.55
detect:
  scanner:
    - cloud.iam_password_policy_weak == true
title: "Cloud IAM password policy does not meet minimum strength requirements"
description_short: "The cloud account's IAM password policy allows weak passwords, making human IAM user credentials susceptible to brute-force and credential-stuffing attacks."
description_long: "An IAM password policy defines the minimum length, complexity, reuse prevention, and maximum age for passwords used by IAM users. A weak policy — for example, no minimum length, no complexity requirement, or no expiry — increases the likelihood that user credentials are guessable, reused from breached services, or remain valid indefinitely after an employee leaves. CIS AWS Foundations Benchmark controls 1.8–1.14 define a comprehensive set of password policy requirements: minimum 14-character length (1.8), require uppercase (1.9), lowercase (1.10), numbers (1.11), and non-alphanumeric characters (1.12), password expiry of 90 days or less (1.13), and prevention of password reuse for at least 24 prior passwords (1.14). NIST 800-53 IA-5(1) mandates enforced password complexity and history for all human accounts. While IAM roles (not users) should be preferred for service-to-service authentication, human IAM users cannot be fully eliminated, making a strong password policy a necessary compensating control."
frameworks:
  - id: "CIS AWS Foundations Benchmark 1.8"
    text: "Ensure IAM password policy requires a minimum length of 14 or greater"
  - id: "CIS AWS Foundations Benchmark 1.9–1.12"
    text: "Ensure IAM password policy requires uppercase, lowercase, numeric, and symbol characters"
  - id: "CIS AWS Foundations Benchmark 1.13"
    text: "Ensure IAM password policy expires passwords within 90 days or less"
  - id: "CIS AWS Foundations Benchmark 1.14"
    text: "Ensure IAM password policy prevents password reuse for 24 or more prior passwords"
  - id: "NIST 800-53 IA-5(1)"
    text: "Authenticator Management — enforce minimum password complexity and restrict password reuse"
  - id: "ISO 27001:2022 A.8.5"
    text: "Secure authentication — define and enforce password complexity standards for all user accounts"
  - id: "SOC 2 CC6.1"
    text: "Logical access — enforce password policies that reduce the risk of credential compromise"
micelium_product:
  - product: Sovera
    role: Cloud IAM posture policy continuously audits account password policy configuration and flags non-compliant settings
  - product: Proof
    role: Generates compliance evidence of IAM password policy configuration for SOC 2, CIS, and NIST audits
industry_overlays:
  financial:
    weight_multiplier: 1.4
  healthcare:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.4
  retail:
    weight_multiplier: 1.3
  technology:
    weight_multiplier: 1.2
  default:
    weight_multiplier: 1.0
remediation_plain: "Strengthen the cloud account's IAM password policy to require at least 14 characters, uppercase and lowercase letters, numbers, and symbols, with expiry every 90 days and prevention of the last 24 passwords from being reused. Longer term, minimise the number of IAM users in favour of IAM roles and SSO-federated access."
remediation_technical: "AWS: update the account password policy via 'aws iam update-account-password-policy --minimum-password-length 14 --require-uppercase-characters --require-lowercase-characters --require-numbers --require-symbols --max-password-age 90 --password-reuse-prevention 24 --hard-expiry'. Verify with 'aws iam get-account-password-policy'. Audit all IAM users for access key age alongside password policy (CIS 1.16 — rotate or deactivate keys older than 90 days). Prefer SSO via AWS IAM Identity Center (formerly SSO) to centralise authentication and eliminate IAM user passwords entirely where possible. Azure AD: in Azure AD > Security > Authentication Methods > Password Protection, configure a minimum password length of 14 and enable custom banned password lists. GCP: enforce organisation-level password policy via the Google Admin console or use Google Workspace's password policy API."
