remediation_plain: "Deploy network detection and response (NDR) or configure your SIEM to ingest internal traffic flow logs. Enable DNS query logging and alert on connections to known-malicious domains. This lets you see attackers moving laterally before they reach critical systems."
remediation_technical: "Deploy a network detection and response (NDR) solution (Vectra AI, Darktrace, ExtraHop, Corelight) or configure flow log collection (NetFlow, VPC Flow Logs, NSG Flow Logs) ingested into your SIEM with east-west traffic rules. Enable DNS security filtering (Cisco Umbrella, Infoblox, or Windows DNS debug logging) and ingest into SIEM. Create lateral movement detection rules: unusual SMB lateral connections, kerberoasting indicators, RDP from unexpected sources. Prioritise internal monitoring for cloud environments where east-west traffic traverses VPC security groups."
