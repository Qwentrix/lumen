id: SECPOS_NO_CENTRAL_LOG
domain: security_posture
severity: high
default_weight: 0.70
detect:
  questionnaire:
    - Q-SECPOS-022 == no_log_collection
    - Q-SECPOS-022 == silo_per_system
    - Q-SECPOS-DD-022 == no_defined_process
title: "No centralised log collection — logs siloed per system"
description_short: "Security logs are not centrally collected — each system retains logs independently with no unified view."
description_long: "Without centralised log collection, correlation across events from different sources is impossible. Attackers who compromise multiple systems sequentially leave a trail that is only visible when logs from endpoints, identity systems, network devices, and cloud services are aggregated. Siloed logs also mean logs are routinely overwritten or lost because individual systems have limited storage. Regulatory frameworks including SOC 2, HIPAA, and FedRAMP require centralised audit logging. Cyber insurers increasingly require a SIEM or equivalent log aggregation platform as a baseline control for coverage eligibility."
frameworks:
  - id: "NIST CSF DE.AE-03"
    text: "Information is correlated from multiple sources to identify security events"
  - id: "CIS Control 8.2"
    text: "Collect audit logs from enterprise assets and software"
  - id: "ISO 27001:2022 A.8.15"
    text: "Logging — log generation, storage, and review"
  - id: "SOC 2 CC7.2"
    text: "The entity monitors system components for anomalies"
  - id: "FedRAMP AU-2"
    text: "Event logging — selection of auditable events"
  - id: "CISA Zero Trust Pillar: Visibility and Analytics"
    text: "Centralised telemetry collection enabling cross-source correlation"
micelium_product:
  - product: Sense
    role: Ingests and correlates logs from disparate sources to surface threats requiring centralised visibility
  - product: Proof
    role: Tamper-evident centralised audit log storage for compliance and forensic investigation
industry_overlays:
  healthcare:
    weight_multiplier: 1.4
  financial:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.5
  technology:
    weight_multiplier: 1.2
  default:
    weight_multiplier: 1.0
remediation_plain: "Consolidate logs from all major sources — endpoints, servers, identity systems, cloud services, and network devices — into a single platform. This is the foundation for all security monitoring and most compliance requirements."
remediation_technical: "Deploy a SIEM or log management platform (Splunk, Microsoft Sentinel, Elastic SIEM, Chronicle) with collectors covering: endpoints (EDR/Windows Event Forwarding), identity (IdP/LDAP), cloud (AWS CloudTrail, Azure Activity Log, GCP Audit Logs), and network (firewall/flow logs). Establish a log onboarding standard that includes new systems in the SIEM within 48 hours of provisioning. Configure log storage and forwarding with compression. Define a log-source inventory and monitor for gaps. Establish daily data ingestion volume baselines to detect source outages."
