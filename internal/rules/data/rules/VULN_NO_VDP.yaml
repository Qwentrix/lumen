id: VULN_NO_VDP
domain: vulnerabilities
severity: medium
default_weight: 0.4
detect:
  questionnaire:
    - Q-VULN-004 == none
title: "No vulnerability disclosure programme"
description_short: "No programme exists for external researchers to responsibly report security issues."
description_long: "Without a Vulnerability Disclosure Policy (VDP), external researchers who discover issues have no clear path to report them, increasing the likelihood that findings are sold to adversaries or publicly disclosed without remediation opportunity."
frameworks:
  - id: "NIST SP 800-216"
    text: "Recommendations for Federal Vulnerability Disclosure Guidelines"
  - id: "ISO 29147"
    text: "Vulnerability disclosure"
micelium_product:
  - product: Proof
    role: Evidence collection for responsible disclosure audit trail
industry_overlays:
  technology:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Publish a security.txt file and a simple VDP page explaining how to report vulnerabilities and what researchers can expect."
remediation_technical: "Adopt the CERT/CC or disclose.io VDP template. Define a coordinated disclosure timeline (e.g. 90-day). Consider a bug-bounty platform (HackerOne/Bugcrowd) once internal triage capacity exists."
