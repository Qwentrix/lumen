remediation_plain: "Identify every processing activity that meets GDPR Art. 35 high-risk criteria and ensure a completed, documented DPIA exists for each one before that processing continues. Do not start new high-risk processing without a completed DPIA."
remediation_technical: "1. Conduct a processing inventory audit against the Art. 35 high-risk criteria list (WP248/EDPB guidelines): profiling with legal/significant effects, large-scale special-category data, systematic public monitoring, new technologies, automated decision-making. 2. For each high-risk activity lacking a DPIA, complete a DPIA under Art. 35(7): description of processing, necessity/proportionality assessment, risk evaluation, mitigation measures. 3. Have DPIAs reviewed and approved by the DPO or qualified counsel before relying on them. 4. Where residual risk remains high after DPIA, consult the supervisory authority per Art. 36 before commencing. 5. Implement a DPIA screening checklist as a gate in the new product/feature approval workflow."
