id: PRIV_ROPA_GAP
domain: privacy
severity: high
default_weight: 0.75
detect:
  questionnaire:
    - Q-PRIV-010 == no
    - Q-PRIV-010 == ad_hoc
    - Q-PRIV-DD-005 == no_ropa
    - Q-PRIV-DD-005 == partial_ropa
    - Q-PRIV-DD-007 == no_lineage_tracking
    - Q-PRIV-DD-008 == no_process
    - Q-PRIV-DD-031 == no_ropa
title: "Records of Processing Activities (ROPA) absent, incomplete, or not maintained as a living document"
description_short: "The organization has no ROPA, has a partial ROPA that does not cover all processing activities, or does not update the ROPA when new processing activities are introduced."
description_long: "GDPR Art. 30 mandates that every controller and processor maintain a ROPA. For controllers, Art. 30(1) requires: name and contact details of controller, DPO, and any joint controllers; purposes of processing; categories of data subjects and personal data; categories of recipients; cross-border transfer details and mechanisms; and envisaged retention periods. A ROPA that covers only some processing activities fails Art. 30 for the uncovered activities. A ROPA that exists but is not updated when new activities commence (no pre-launch review gate, Q-PRIV-010 == no; new SaaS not captured, Q-PRIV-DD-008 == no_process) creates a drift between documented and actual processing that accumulates rapidly. Supervisory authorities request the ROPA as the first document in compliance investigations — an absent or obviously incomplete ROPA is strong evidence of systemic non-compliance."
frameworks:
  - id: "GDPR Art. 30"
    text: "Records of processing activities — mandatory for controllers and processors; required elements specified"
  - id: "GDPR Art. 30(4)"
    text: "ROPA must be available to supervisory authority on request"
  - id: "GDPR Art. 30(1)(a)–(f)"
    text: "Mandatory ROPA elements: controller identity, purposes, data categories, recipients, transfers, retention"
  - id: "CCPA §1798.130"
    text: "Privacy notice must accurately describe data collection and use — requires underlying ROPA-equivalent documentation"
  - id: "ISO 27018 §5.1"
    text: "Accurate and current processing records are a foundational cloud privacy control"
  - id: "NIST Privacy Framework PR.ID-1"
    text: "Personal data inventory with processing purposes — equivalent to ROPA requirement"
micelium_product:
  - product: Sovera
    role: Generates and maintains ROPA-compliant records of processing activities, auto-updating when data flows or processing purposes change
  - product: Proof
    role: Manages ROPA documentation lifecycle including version control, review dates, and evidence packaging for supervisory authority production
  - product: Sypher
    role: Provides data classification metadata that populates ROPA entries with data category and sensitivity information
