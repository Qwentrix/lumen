remediation_plain: "Build your ROPA to cover every processing activity — not just the obvious ones. Keep it updated whenever you add a new feature, adopt a new SaaS tool, or change how you use personal data. Regulators ask for this document first; it must be ready."
remediation_technical: "1. Conduct a full processing activity inventory to identify every activity that needs a ROPA entry. 2. For each activity, document the mandatory Art. 30(1) elements: controller/DPO contact, purpose of processing, legal basis, data subject categories, data categories, recipient categories, cross-border transfers and mechanisms, retention periods. 3. Structure the ROPA so it can be updated modularly when individual activities change. 4. Implement a pre-launch gate: all new processing activities must have a ROPA entry created and approved before launch. 5. Integrate ROPA with data inventory: SaaS onboarding triggers a ROPA entry, not just a data map update. 6. Schedule annual ROPA reviews: full audit of all entries against actual processing, with documented reviewer sign-off. 7. Ensure the ROPA is producible to a supervisory authority within 24 hours of request."
