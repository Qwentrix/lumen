id: AIGOV_AI_SHARED_KEYS
domain: ai_governance
severity: high
default_weight: 0.70
detect:
  questionnaire:
    - Q-AIGOV-038 == shared_team_key
    - Q-AIGOV-038 == single_org_key
  scanner:
    - ai_governance.mcp_servers_running > 0
title: "AI API keys shared across users or systems — no individual accountability"
description_short: "AI API credentials are shared at team or organisation level, making individual usage attribution impossible and key revocation disruptive."
description_long: "Shared AI API keys eliminate individual accountability for AI usage. When a key is shared across a team or the entire organisation, the usage logs — if any exist — show only the key, not the person. This means policy violations, data leakage incidents, or suspicious usage patterns cannot be attributed to a responsible individual. Additionally, revoking a shared key when one member of the sharing group is suspected of misuse disables all dependent systems simultaneously, creating operational pressure to delay revocation. Shared single-organisation keys are also higher-value targets for exfiltration because they unlock all users' AI access in one credential. NIST AI RMF GOVERN-1.2 requires clear accountability structures for AI system operation — individual key assignment is a prerequisite for this. NIST SP 800-204D recommends identity-bound credentials for AI API access."
frameworks:
  - id: "NIST AI RMF GOVERN-1.2"
    text: "Organisational accountability — individual key assignment enables attribution of AI usage to accountable persons"
  - id: "NIST AI RMF MEASURE-2.6"
    text: "AI system use is monitored with sufficient granularity — shared keys prevent per-person usage attribution"
  - id: "ISO 42001 A.9.2"
    text: "User access management — AI system access shall be managed with individual identities and accountability"
micelium_product:
  - product: Sigil
    role: Issues and manages per-user and per-agent AI API credentials, providing individual usage attribution and enabling targeted revocation without system-wide disruption
  - product: Proof
    role: Generates per-user AI usage audit reports for compliance evidence, only possible when individual keys are in use
industry_overlays:
  technology:
    weight_multiplier: 1.4
  financial:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.4
  healthcare:
    weight_multiplier: 1.3
  it_services:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Give every person who uses AI tools their own individual API key, or route all AI access through a centralised system that tracks usage by user. Shared keys make it impossible to know who did what."
remediation_technical: "Migrate from shared keys to one of two models: (1) per-user key provisioning — each user receives an individual API key provisioned by IT, stored in a secrets manager, with usage attributed to that person in audit logs; or (2) centralised AI gateway — all AI API traffic is routed through an internal proxy that authenticates users individually and injects API credentials at the proxy layer, so users never hold keys directly. Either model enables per-user usage accounting and targeted revocation. Revoke all existing shared keys once migration is complete. Set a policy prohibiting key sharing."
