remediation_plain: "For data stored encrypted, the most reliable way to ensure it is truly gone — including from backups — is to destroy the encryption key. Implement per-user or per-record encryption keys so that deleting a key renders all copies of that person's data permanently irrecoverable."
remediation_technical: "1. Design a per-user or per-data-subject key hierarchy using a KMS (AWS KMS, Azure Key Vault, HashiCorp Vault, or Micelium Sypher). 2. Encrypt personal data under user-specific Data Encryption Keys (DEKs) wrapped by the KMS. 3. When a deletion/erasure request is received: delete or revoke the user's DEK in the KMS rather than attempting physical deletion of all copies. 4. Document the cryptographic erasure as the deletion mechanism in the DSAR response — the data is permanently irrecoverable. 5. Ensure backup encryption uses the same key hierarchy so backups are also covered by key destruction. 6. Implement key deletion confirmation logging for Art. 17 accountability records."
