id: COMP_VENDOR_REVIEW_INFREQUENT
domain: compliance
severity: medium
default_weight: 0.40
detect:
  questionnaire:
    - Q-COMP-015 == ad_hoc
    - Q-COMP-015 == every_two_to_three_years
title: "Critical vendor security reviews are infrequent"
description_short: "Critical vendors are reviewed for security and compliance posture less frequently than annually."
description_long: "Vendors that were compliant at onboarding may have experienced breaches, reduced their security practices, lost certifications, or introduced new third-party subprocessors since the last review. PCI DSS 12.8.4 requires at least annual monitoring of critical service providers' compliance status. ISO 27001 A.15.2.2 requires regular reviews of supplier services. Ad hoc or every-2-3-year review cycles leave organisations exposed to vendor-introduced risk that accumulated silently. Third-party breaches that propagate to customers are increasingly a leading cause of regulatory enforcement actions."
frameworks:
  - id: "PCI DSS Req 12.8.4"
    text: "Monitor critical service provider compliance status at least annually"
  - id: "ISO 27001 A.15.2.2"
    text: "Managing changes to supplier services — regular reviews"
  - id: "SOC 2 CC9.2"
    text: "Vendor and business partner monitoring"
  - id: "NIST SP 800-161r1"
    text: "Cybersecurity Supply Chain Risk Management — ongoing vendor monitoring"
industry_overlays:
  healthcare:
    weight_multiplier: 1.4
  financial:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.4
  legal:
    weight_multiplier: 1.3
  retail:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Establish an annual review cadence for all critical vendors — at minimum, request their current SOC 2 report or ISO 27001 certificate and confirm their security practices have not changed materially."
remediation_technical: "Create a vendor register with assigned criticality tiers. Define annual review requirements for Tier-1 (data-handling) vendors: re-request SOC 2 Type II / ISO 27001 certificate, confirm no material subprocessor changes, and re-evaluate contract data-handling provisions. Use a vendor risk management platform (OneTrust, Prevalent, ProcessUnity) or your GRC tool to track review due dates. Escalate non-compliant or unresponsive vendors to procurement for remediation."
