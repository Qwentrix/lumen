remediation_plain: "Segment your network so that a single exploited machine cannot reach everything else. A compromised workstation should never be able to directly connect to a database server or domain controller. Containment boundaries limit how far an attacker can move after they exploit a vulnerability."
remediation_technical: "Prioritise segmentation decisions based on exploit impact: isolate internet-facing services and workstations from internal server tiers immediately. Implement VLAN separation with inter-VLAN firewall rules scoped to minimum required flows — audit firewall rules for any-any entries. Apply micro-segmentation using cloud-native security groups or a service mesh for workload-to-workload east-west traffic, ensuring each workload only allows inbound connections from its known upstream dependencies. Integrate network segmentation enforcement with your vulnerability management programme: when a critical CVE is disclosed for a service, the blast radius of exploitation should be bounded by the segment boundary. For high-value data assets, deploy ZTNA to require per-request authorisation regardless of network position."
