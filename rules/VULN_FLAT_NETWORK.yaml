id: VULN_FLAT_NETWORK
domain: vulnerabilities
severity: high
default_weight: 0.80
detect:
  questionnaire:
    - Q-VULN-024 == flat_network
    - Q-VULN-024 == unknown
title: "Flat network — CVE exploitation enables unconstrained lateral movement"
description_short: "No network segmentation means a single exploited vulnerability or compromised endpoint provides an attacker with unrestricted east-west access to all systems."
description_long: "When a vulnerability is exploited — whether a remote-code-execution CVE in a public-facing service, a phishing-delivered payload, or a supply-chain compromise — the absence of network segmentation converts that single foothold into full network access. Attackers pivot freely from the initially compromised host to databases, domain controllers, backup infrastructure, and financial systems without encountering a barrier. This dramatically amplifies the damage potential of every unpatched CVE in the environment. Ransomware actors and nation-state threat groups explicitly enumerate network topology after initial compromise and accelerate lateral movement when they encounter flat networks. In regulated industries, segmentation is often an explicit audit requirement tied to cardholder data environment (PCI DSS) or controlled unclassified information (FedRAMP) boundaries."
frameworks:
  - id: "NIST SP 800-53 SC-7"
    text: "Boundary Protection — network segmentation"
  - id: "CIS Control 12"
    text: "Network Infrastructure Management and segmentation"
  - id: "NIST SP 800-207"
    text: "Zero Trust Architecture — network microsegmentation"
  - id: "PCI DSS Req 1.3"
    text: "Network access controls protecting the cardholder data environment"
