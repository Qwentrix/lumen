remediation_plain: "Inventory all third-party vendors who access personal data and put a Data Processing Agreement in place with each before sharing any data."
remediation_technical: "Audit vendor contracts for DPA coverage. Use GDPR-standard DPA clauses (EU SCCs for international transfers). Maintain a processor register in your GRC platform with DPA status, renewal date, and sub-processor list. Block new vendor onboarding until DPA is signed."
