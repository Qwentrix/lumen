id: PRIV_NO_DPA
domain: privacy
severity: critical
default_weight: 0.85
detect:
  questionnaire:
    - Q-PRIV-004 == no
title: "No data processing agreements with third-party processors"
description_short: "Data processing agreements are not in place with third-party vendors who process personal data."
description_long: "GDPR Art. 28 mandates that any organisation passing personal data to a third-party processor must have a binding Data Processing Agreement in place before processing begins. Transferring personal data without a DPA is a direct infringement that regulators have fined, regardless of the processor's own compliance posture."
frameworks:
  - id: "GDPR Art. 28"
    text: "Processor obligations — controller must only use processors providing sufficient guarantees"
  - id: "HIPAA 164.308(b)"
    text: "Business associate contracts"
  - id: "CCPA §1798.100"
    text: "Service provider contracts restricting personal information use"
