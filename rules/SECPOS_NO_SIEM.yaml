id: SECPOS_NO_SIEM
domain: security_posture
severity: critical
default_weight: 0.90
detect:
  questionnaire:
    - Q-SECPOS-023 == no_monitoring_platform
    - Q-SECPOS-023 == vendor_consoles_only
    - Q-SECPOS-026 == no_alerting
    - Q-SECPOS-DD-019 == default_rules_no_tuning
    - Q-SECPOS-DD-020 == no_detection_rules
title: "No SIEM or unified security monitoring platform"
description_short: "No SIEM or equivalent monitoring platform exists — alerts are reviewed per-vendor tool only."
description_long: "Without a SIEM, security events from different sources are never correlated, and multi-stage attacks remain invisible until they cause visible damage. A SIEM is the operational centre of any security programme: it aggregates logs, fires cross-source detection rules, manages alert queues, and provides the investigation context needed for effective response. Organisations without a SIEM have dramatically higher mean time to detect (IBM CODB 2024: 204 days average, versus under 90 days with SIEM). Most enterprise cyber insurance policies and compliance frameworks (SOC 2, FedRAMP, HIPAA) treat SIEM-equivalent alerting as a baseline requirement."
frameworks:
  - id: "NIST CSF DE.AE-03"
    text: "Information is correlated from multiple sources"
  - id: "CIS Control 8.11"
    text: "Conduct audit log reviews — automated alerting on anomalies"
  - id: "ISO 27001:2022 A.8.16"
    text: "Monitoring activities"
  - id: "SOC 2 CC7.2"
    text: "System components monitored for anomalies indicating malicious acts"
  - id: "FedRAMP SI-4"
    text: "System monitoring — SIEM or equivalent"
  - id: "CISA Zero Trust Pillar: Visibility and Analytics"
    text: "Centralised visibility and analytics capability across all pillars"
