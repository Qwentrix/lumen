id: COMP_BREACH_NOTIFICATION_UNTESTED
domain: compliance
severity: medium
default_weight: 0.45
detect:
  questionnaire:
    - Q-COMP-023 == yes_documented_not_tested
title: "Breach notification process not tested"
description_short: "A breach notification process is documented but has not been tested to confirm it works under real conditions."
description_long: "An untested notification process almost always contains hidden gaps: outdated regulator contact information, unclear ownership of the notification decision, missing legal review steps, or templates that have not been vetted. Regulators and auditors alike expect organisations to demonstrate that they have practised their notification process — PCI DSS 12.10.6 requires annual IRP testing that includes notification procedures. An untested process discovered to be broken during an actual breach can turn a manageable incident into a regulatory enforcement action."
frameworks:
  - id: "PCI DSS Req 12.10.6"
    text: "Incident response plan — annual testing including notification procedures"
  - id: "GDPR Art. 33 (recital 87)"
    text: "Obligation to ensure notification procedures are implemented effectively"
  - id: "HIPAA Breach Notification Rule"
    text: "Testing that notification timelines and procedures are operationally viable"
industry_overlays:
  healthcare:
    weight_multiplier: 1.4
  financial:
    weight_multiplier: 1.3
  government:
    weight_multiplier: 1.3
  retail:
    weight_multiplier: 1.2
  default:
    weight_multiplier: 1.0
remediation_plain: "Run a tabletop exercise that walks through the notification process end to end — confirm contact lists are current, timelines are achievable, and everyone knows their role."
remediation_technical: "Include breach notification procedure testing in your annual IRP tabletop. Use a realistic scenario (e.g., ransomware with suspected data exfiltration). Walk through the 72-hour GDPR clock explicitly. Verify regulator portal access and submission process. Update contact information for regulators and legal counsel. Document the test and its findings as audit evidence. Refine the notification procedure within 30 days of the exercise."
