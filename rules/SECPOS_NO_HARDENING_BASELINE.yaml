id: SECPOS_NO_HARDENING_BASELINE
domain: security_posture
severity: high
default_weight: 0.65
detect:
  questionnaire:
    - Q-SECPOS-039 == no_hardening
    - Q-SECPOS-039 == vendor_defaults_only
    - Q-SECPOS-DD-034 == no_benchmark
    - Q-SECPOS-DD-037 == no_container_scanning
title: "No documented hardening baseline or configuration drift detection process"
description_short: "No approved hardening baseline standard has been documented, and no continuous process exists to detect when system configurations drift from the intended secure state."
description_long: "A hardening baseline is a governance and process finding: the organisation has not selected, documented, or formally adopted a hardening standard (CIS Benchmarks, DISA STIGs, or equivalent), and has no continuous process to detect and remediate configuration drift. This is distinct from systems that have been hardened but are drifting — it reflects the absence of the hardening programme itself. Without a documented baseline, there is no authoritative definition of what a correctly configured system looks like, which means audit findings have no remediation target, developers have no secure-by-default reference, and the organisation cannot demonstrate to auditors that hardening is a managed process rather than ad hoc effort. Configuration drift detection is equally critical: even organisations that harden at build time find configurations drift over time through manual changes, software updates, and misconfigured automation. Without continuous drift detection, the hardened state is not maintained."
frameworks:
  - id: "NIST CSF PR.PS-01"
    text: "Configuration management practices are established and maintained"
  - id: "CIS Control 4.1"
    text: "Establish and maintain a secure configuration process for enterprise assets"
  - id: "CIS Benchmark"
    text: "CIS Benchmarks for OS, cloud, container, and application hardening"
  - id: "ISO 27001:2022 A.8.9"
    text: "Configuration management — security hardening of systems"
  - id: "SOC 2 CC6.1"
    text: "Logical and physical access security controls include hardened configurations"
  - id: "FedRAMP CM-6"
    text: "Configuration settings — implementation of security configuration checklists"
  - id: "CISA Zero Trust Pillar: Devices"
    text: "Device security enforced through hardened configuration baselines"
