remediation_plain: "Select a hardening standard, document it as an approved policy, and then set up automated monitoring to alert you when systems deviate from it. The standard itself is less important than having one formally adopted and consistently applied — CIS Benchmarks Level 1 is a reasonable starting point for most environments."
remediation_technical: "1. Formally adopt a documented hardening standard: select CIS Benchmarks (Level 1 minimum, Level 2 for sensitive workloads) or DISA STIGs for government environments. Record the selection as an approved policy document referencing specific benchmark versions. 2. Create golden images/AMIs with benchmarks applied using configuration management (Ansible, Chef, Puppet) so every provisioned system starts in a known-good state. 3. Establish continuous drift detection: deploy AWS Config Rules, Azure Policy, or a CSPM tool to alert when running configurations deviate from the approved baseline. Define remediation SLAs per finding severity. 4. Integrate baseline compliance scoring into your engineering metrics: track benchmark compliance score per system class and report trends to the security team. 5. Establish a change-management process for approved exceptions, documented with rationale and compensating controls, so the programme accounts for legitimate deviations without treating them as uncontrolled drift."
