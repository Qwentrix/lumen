id: COMP_MFA_PARTIAL
domain: compliance
severity: medium
default_weight: 0.45
detect:
  questionnaire:
    - Q-COMP-001 == yes_admin
title: "MFA enforced for admins only"
description_short: "MFA is applied to admin accounts but not all users."
description_long: "Restricting MFA to administrators leaves standard user accounts as the primary phishing and credential-stuffing target. Many breaches begin with a low-privilege account and escalate. Most frameworks now require universal MFA."
frameworks:
  - id: "PCI DSS Req 8.4.2"
    text: "MFA required for all access into the CDE"
  - id: "NIST SP 800-63B"
    text: "Authenticator assurance levels"
industry_overlays:
  healthcare:
    weight_multiplier: 1.3
  financial:
    weight_multiplier: 1.2
  default:
    weight_multiplier: 1.0
remediation_plain: "Extend MFA enforcement to all users, not just admins. Pilot a phishing-resistant method (passkey or hardware key) for high-value roles."
remediation_technical: "Progressively roll out MFA via IdP conditional access policies. Exclude break-glass accounts carefully with compensating controls. Track coverage metrics in your IAM dashboard."
