id: VULN_NO_SECRETS_SCAN
domain: vulnerabilities
severity: high
default_weight: 0.80
detect:
  questionnaire:
    - Q-VULN-027 == no_secrets_scanning
title: "No secrets scanning in source repositories"
description_short: "Source code repositories and CI/CD pipelines are not scanned for accidentally committed secrets."
description_long: "Accidentally committed API keys, tokens, database credentials, and private keys are one of the most common and costliest supply-chain and cloud breach vectors. Once a secret enters a repository's git history, it is effectively public — even after deletion — unless rotated immediately. NIST SP 800-218 SSDF PW.7.1 requires checking for hardcoded credentials in code. Without automated secrets scanning, leaked credentials can persist undetected for months, enabling account takeover, data exfiltration, or cloud resource abuse."
frameworks:
  - id: "NIST SP 800-218 SSDF PW.7.1"
    text: "Check for hardcoded credentials and sensitive data in code and configuration"
  - id: "CIS Software Supply Chain Security Guide"
    text: "Secrets scanning as a CI/CD gate"
  - id: "OWASP Top 10 A07:2021"
    text: "Identification and Authentication Failures — hardcoded credentials"
industry_overlays:
  technology:
    weight_multiplier: 1.5
  it_services:
    weight_multiplier: 1.5
  financial:
    weight_multiplier: 1.4
  healthcare:
    weight_multiplier: 1.3
  government:
    weight_multiplier: 1.4
  retail:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Enable automated secrets scanning on all repositories. Set up pre-commit hooks to prevent secrets from being committed in the first place, and add a CI pipeline check to catch anything that slips through."
remediation_technical: "Enable GitHub Advanced Security / GitLab Secret Detection or deploy Gitleaks/TruffleHog as a pre-commit hook and CI gate. Scan historical git history for existing leaks using `gitleaks detect --no-git`. Immediately revoke and rotate any discovered secrets. Enroll in GitHub push protection to block secrets at push time."
