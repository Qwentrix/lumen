id: PRIV_NO_SCC
domain: privacy
severity: critical
default_weight: 0.90
detect:
  questionnaire:
    - Q-PRIV-030 == yes_not_documented
    - Q-PRIV-031 == no_awareness
    - Q-PRIV-031 == partial_awareness
    - Q-PRIV-032 == no
    - Q-PRIV-032 == yes_some
    - Q-PRIV-DD-031 == ropa_exists_not_complete
    - Q-PRIV-DD-032 == no_gate
title: "No Standard Contractual Clauses or equivalent for EU personal data transfers to non-adequate countries"
description_short: "Personal data originating in the EU/EEA is transferred to recipients in countries lacking an EU adequacy decision without Standard Contractual Clauses, BCRs, or another approved GDPR Chapter V transfer mechanism."
description_long: "GDPR Art. 44 prohibits transfers of personal data to third countries unless a valid transfer mechanism applies. Standard Contractual Clauses (updated 2021 Commission Implementing Decision EU 2021/914), BCRs, the EU-US Data Privacy Framework, and adequacy decisions are the primary mechanisms. Transferring EU personal data to a US cloud provider, SaaS vendor, or group entity without SCCs or DPF participation is unlawful — this is among the most frequently enforced GDPR violations, with fines ranging from hundreds of thousands to hundreds of millions of euros. Partial compliance (SCCs with some recipients but not all) means transfers to uncovered recipients remain unlawful. Absence of a legal review gate for new cross-border flows (Q-PRIV-DD-032 == no_gate) ensures new unlawful transfers will continue to be created."
frameworks:
  - id: "GDPR Art. 44"
    text: "General principle for transfers — transfers only permitted with valid mechanism (adequacy, SCCs, BCRs, DPF)"
  - id: "GDPR Art. 46"
    text: "Standard Contractual Clauses as transfer safeguard — must use current 2021 SCC form"
  - id: "GDPR Art. 47"
    text: "Binding Corporate Rules as alternative transfer mechanism for group entities"
  - id: "Commission Implementing Decision EU 2021/914"
    text: "Current mandatory SCC form for controller-to-controller and controller-to-processor transfers"
  - id: "ISO 27018 §5.4"
    text: "Cross-border transfer mechanisms required for cloud personal data processing outside originating jurisdiction"
