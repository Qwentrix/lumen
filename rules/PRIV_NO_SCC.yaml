remediation_plain: "Every transfer of EU personal data to a country without an adequacy decision — including to US-based cloud services and SaaS tools — requires Standard Contractual Clauses or another approved mechanism. Identify all such transfers and execute the 2021 SCCs with each recipient that is not covered."
remediation_technical: "1. Map all transfers of EU personal data to non-adequate third countries: identify the data categories, the recipient, and the recipient's country for each transfer. 2. For US recipients: verify whether they participate in the EU-US Data Privacy Framework (check DPF list at privacyshield.gov); if not, execute 2021 Module 2 or Module 1 SCCs. 3. For non-EU, non-DPF recipients: execute applicable 2021 SCC module (controller-to-controller = Module 1, controller-to-processor = Module 2). 4. Conduct a Transfer Impact Assessment (TIA) for each transfer, assessing the recipient country's legal framework for government access to personal data. 5. Add a mandatory legal review gate to new vendor onboarding: cross-border transfers must be identified and the transfer mechanism confirmed before data sharing begins. 6. Update the Art. 30 ROPA to include transfer mechanism for each cross-border transfer per Art. 30(1)(e)."
