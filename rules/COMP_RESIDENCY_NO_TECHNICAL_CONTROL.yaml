id: COMP_RESIDENCY_NO_TECHNICAL_CONTROL
domain: compliance
severity: high
default_weight: 0.70
detect:
  questionnaire:
    - Q-COMP-DD-028 == no_technical_controls
title: "Data residency enforced by policy only — no technical controls preventing cross-region replication"
description_short: "Data residency obligations exist but are enforced only by policy with no technical controls preventing unauthorised replication."
description_long: "Policy-only residency enforcement is fragile. Misconfigured storage buckets, new service deployments with default regions, backup and DR processes that replicate to secondary regions, and cloud provider features that automatically replicate data across zones can all violate residency requirements without any intentional decision. When a residency breach is discovered — often through a customer audit or regulatory inspection — the organisation must demonstrate that it took reasonable technical steps to prevent the violation, not just that it had a policy. Regulators in the EU (GDPR Chapter V), Germany (BSI), France (CNIL), and increasingly in government and defence contracting contexts expect technical enforcement of residency as a baseline."
frameworks:
  - id: "GDPR Ch. V"
    text: "Transfers of personal data to third countries — technical controls must prevent unauthorised transfers"
  - id: "FedRAMP SC-28 / AC-20"
    text: "Protection of information at rest and use of external information systems — residency boundary enforcement required"
  - id: "ISO 27001 A.13.2.3"
    text: "Electronic messaging — ensure data transfer restrictions are technically enforced"
  - id: "NIST SP 800-53 SC-12"
    text: "Cryptographic key establishment and management — data sovereignty requires technical controls"
industry_overlays:
  government:
    weight_multiplier: 1.8
  healthcare:
    weight_multiplier: 1.5
  financial:
    weight_multiplier: 1.6
  legal:
    weight_multiplier: 1.5
  manufacturing:
    weight_multiplier: 1.4
  default:
    weight_multiplier: 1.0
remediation_plain: "Implement technical controls — cloud region restrictions, encryption key boundaries, or network policies — that physically prevent your data from leaving the required geographic region. A policy alone is not sufficient for regulatory purposes."
remediation_technical: "Implement cloud-native data residency controls: restrict storage account and database creation to approved regions via policy-as-code (AWS SCP, Azure Policy, GCP Org Policy). Enable Customer-Managed Encryption Keys (CMEK) with key material stored in a KMS bound to the required region. Configure backup and DR replication to stay within the residency boundary. Enable cloud provider data residency assurance features (AWS GovCloud isolation, Azure Geo-Redundancy within region pairs, GCP Data Residency Controls). Audit all storage services quarterly to detect out-of-region replication. For highest-sensitivity scenarios, implement network-layer geo-blocking to prevent data egress to unauthorised regions."
