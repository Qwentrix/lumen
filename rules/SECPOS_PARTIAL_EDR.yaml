id: SECPOS_PARTIAL_EDR
domain: security_posture
severity: high
default_weight: 0.55
detect:
  questionnaire:
    - Q-SECPOS-012 == edr_partial
    - Q-SECPOS-016 == no_centralized_visibility
    - Q-SECPOS-DD-010 == endpoints_only
    - Q-SECPOS-DD-011 == over_day_or_unknown
    - Q-SECPOS-DD-012 == reduced_controls_for_dev
title: "Partial EDR coverage — gaps in endpoint protection or centralised visibility"
description_short: "EDR is not deployed to all endpoints, or centralised endpoint security visibility is absent."
description_long: "Partial EDR coverage is only marginally better than no EDR: attackers will identify and target unprotected devices as the path of least resistance. Developer workstations, servers, and cloud VMs are commonly excluded from EDR scope despite being high-value targets. Without centralised visibility, an organisation cannot determine its actual coverage percentage, cannot respond consistently, and cannot demonstrate compliance. CIS Control 1 (Asset Inventory) and Control 13 (Endpoint Defense) both require complete and verified coverage."
frameworks:
  - id: "NIST CSF DE.CM-01"
    text: "System components are monitored to find potentially adverse events"
  - id: "CIS Control 1.1"
    text: "Establish and maintain a detailed enterprise asset inventory"
  - id: "CIS Control 13.7"
    text: "Deploy host-based intrusion detection and response"
  - id: "ISO 27001:2022 A.8.7"
    text: "Protection against malware on all relevant assets"
  - id: "SOC 2 CC7.2"
    text: "Entity monitors all in-scope system components for anomalies"
  - id: "FedRAMP CM-8"
    text: "Information system component inventory"
  - id: "CISA Zero Trust Pillar: Devices"
    text: "Complete device inventory and compliance status visibility"
industry_overlays:
  healthcare:
    weight_multiplier: 1.3
  financial:
    weight_multiplier: 1.3
  government:
    weight_multiplier: 1.4
  energy:
    weight_multiplier: 1.3
  manufacturing:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Audit which endpoints do not have EDR installed — including servers, developer laptops, and cloud VMs. Set a 30-day target to reach 100% coverage. Set up a centralised dashboard so you can track endpoint health at a glance."
remediation_technical: "Run an asset discovery sweep (Nmap, cloud provider APIs, MDM inventory) to identify all endpoints. Compare against your EDR console coverage report. Prioritise: servers and cloud VMs first, then developer workstations, then remote endpoints. Use MDM or group policy to automate deployment to newly provisioned assets. Establish a coverage SLA: 100% within 48 hours of device provisioning. Configure automated alerts if a device drops off EDR coverage for more than 24 hours."
