remediation_plain: "Establish a process to monitor for newly published CVEs affecting your EOL and legacy software. Vendor advisories stop at EOL — but CVE researchers and national databases continue publishing findings. You need to be subscribed to them."
remediation_technical: "Subscribe to NIST NVD API notifications for CPE identifiers matching your EOL software. Add CISA KEV monitoring for legacy products. Consider a commercial threat intelligence feed that maintains coverage of EOL software CVE disclosures (Recorded Future, Tenable, Qualys). Integrate CVE alerts for EOL systems into your existing vulnerability triage queue with appropriate priority given the absence of available patches. Document compensating controls alongside each CVE finding for audit purposes."
