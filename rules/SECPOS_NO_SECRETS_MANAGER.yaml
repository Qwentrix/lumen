id: SECPOS_NO_SECRETS_MANAGER
domain: security_posture
severity: high
default_weight: 0.65
detect:
  questionnaire:
    - Q-SECPOS-DD-038 == no_rotation_process
    - Q-SECPOS-DD-039 == env_vars_config_files
    - Q-SECPOS-DD-039 == mixed_no_standard
title: "No secrets manager — application credentials stored in environment variables or config files"
description_short: "Application secrets and credentials are stored in environment variables or config files, with no rotation process."
description_long: "Environment variables and configuration files are fundamentally insecure for long-lived secrets. They are readable by all processes with the same privilege level, often logged in error messages or debug output, included in container images, and stored in version control accidentally. Without a secrets manager, rotation is manual and infrequent — meaning any exposed secret remains valid for a long time. A secrets management platform provides centralised audit logging of every secret access, automatic rotation, fine-grained access control per secret, and a systematic approach to handling credential lifecycle events (employee departure, suspected compromise)."
frameworks:
  - id: "NIST CSF PR.PS-02"
    text: "Software is maintained, replaced, and removed commensurate with risk"
  - id: "CIS Control 4.9"
    text: "Protect dedicated administrator credentials — manage all privileged credential lifecycles"
  - id: "ISO 27001:2022 A.8.24"
    text: "Use of cryptography — key and credentials management"
  - id: "SOC 2 CC6.1"
    text: "Logical access security — credential protection controls"
  - id: "FedRAMP IA-5(7)"
    text: "Authenticator management — no embedded unencrypted static credentials"
  - id: "CISA Zero Trust Pillar: Identity"
    text: "Machine identity management including service accounts and application credentials"
industry_overlays:
  technology:
    weight_multiplier: 1.4
  financial:
    weight_multiplier: 1.5
  healthcare:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.5
  it_services:
    weight_multiplier: 1.4
  default:
    weight_multiplier: 1.0
remediation_plain: "Adopt a secrets management platform such as HashiCorp Vault, AWS Secrets Manager, or Azure Key Vault. Migrate all application credentials out of environment variables and config files. Define a rotation schedule so every secret is automatically rotated without developer intervention."
remediation_technical: "Deploy a secrets manager: HashiCorp Vault (self-hosted or HCP), AWS Secrets Manager, Azure Key Vault, or GCP Secret Manager. Migrate all application secrets to the platform: database passwords, API keys, TLS certificates, OAuth client secrets. Update application code to fetch secrets at runtime via SDK (never at build time). Enable automatic rotation for supported secret types (AWS RDS, Azure SQL, IAM keys). Define rotation schedules per type. Configure audit logging for every secret read and write. Implement IRSA/Workload Identity for cloud workloads so applications authenticate to the secrets manager using their compute identity rather than static credentials."
