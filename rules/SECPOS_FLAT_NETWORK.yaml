remediation_plain: "Design your network architecture before trying to implement controls. Define which zones you need (e.g. user workstations, server tier, database tier, management plane), what traffic should flow between them, and what should be blocked by default. Document it, get it approved, and then enforce it with VLANs and firewall rules."
remediation_technical: "Start with architecture documentation: define a tiered zone model (DMZ, application tier, data tier, management tier) and produce an approved data-flow diagram showing allowed inter-zone communications. This document becomes the authoritative basis for firewall ruleset design. Implement the architecture using VLANs with stateful inter-VLAN firewall rules (default-deny posture, explicit allow per approved flow). For cloud environments, enforce segmentation via VPC/subnet boundaries with security groups scoped to service identity rather than IP ranges. Establish a change-management process for firewall rule additions that requires reference to the approved zone model. For regulated scope reduction (PCI CDE, FedRAMP CUI boundary), the zone model must be explicit enough to support scoping decisions. Review the zone model and firewall rules annually and after significant infrastructure changes."
