id: PRIV_MULTISTATE_GAP
domain: privacy
severity: medium
default_weight: 0.55
detect:
  questionnaire:
    - Q-PRIV-049 == no_tracking
    - Q-PRIV-049 == ccpa_only
title: "US multi-state privacy law obligations are not systematically tracked"
description_short: "The organization tracks CCPA but not the growing set of US state privacy laws — Virginia VCDPA, Colorado CPA, Connecticut CTPA, Texas TDPSA, and others — that impose separate obligations and consumer rights."
description_long: "Since 2021, a wave of US state privacy laws has enacted obligations broadly similar to GDPR: consumer rights (access, deletion, correction, portability, opt-out of sale/sharing/profiling), privacy notices, data protection assessments for high-risk processing, and processor contracts. As of 2025, 20+ US states have enacted comprehensive privacy laws. Organizations tracking only CCPA/CPRA are exposed to: Virginia VCDPA (right to appeal), Colorado CPA (universal opt-out mechanism), Connecticut CTPA, Texas TDPSA, Montana, Iowa, and others. Enforcement has begun — Virginia's AG and Colorado's AG have both initiated investigations. The patchwork nature of these laws means obligations differ by state: some require opt-in for sensitive data, some require data protection impact assessments for certain processing, and all have different thresholds."
frameworks:
  - id: "CCPA/CPRA §1798.100–1798.199"
    text: "California Consumer Privacy Act/Privacy Rights Act — foundational US state privacy rights framework"
  - id: "Virginia VCDPA"
    text: "Virginia Consumer Data Protection Act — includes right to appeal and data protection assessments"
  - id: "Colorado CPA"
    text: "Colorado Privacy Act — requires universal opt-out mechanism and data protection assessments"
  - id: "NIST Privacy Framework GV.PO-2"
    text: "Privacy obligations and applicable privacy requirements are identified, documented, and managed"
  - id: "ISO 27018 §5.4"
    text: "Ongoing monitoring of applicable legal requirements for personal data"
industry_overlays:
