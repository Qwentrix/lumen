id: COMP_NO_ISMS_POLICY
domain: compliance
severity: high
default_weight: 0.7
detect:
  questionnaire:
    - Q-COMP-002 == no_policy
title: "No information security policy"
description_short: "No formally documented information security policy exists."
description_long: "An information security policy is the foundational governance document required by every major framework (ISO 27001, SOC 2, HIPAA, NIST CSF). Its absence signals undeveloped governance and is an automatic audit finding across all regulated industries."
frameworks:
  - id: "ISO 27001:2022 A.5.1"
    text: "Policies for information security"
  - id: "SOC 2 CC2.2"
    text: "COSO: Internal communication of information"
  - id: "NIST CSF GV.PO-01"
    text: "Organisational cybersecurity policy is established"
industry_overlays:
  government:
    weight_multiplier: 1.4
  healthcare:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Draft and approve a high-level information security policy covering objectives, scope, roles, and consequences for non-compliance. Review annually."
remediation_technical: "Adopt the SANS Policy Templates or CIS Policy framework as a starting point. Version-control policies in a GRC platform. Link policy controls to evidence artefacts for audit readiness."
