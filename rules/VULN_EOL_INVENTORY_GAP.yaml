id: VULN_EOL_INVENTORY_GAP
domain: vulnerabilities
severity: medium
default_weight: 0.45
detect:
  questionnaire:
    - Q-VULN-011 == partial_inventory
title: "Partial end-of-support inventory — some asset types or environments not tracked"
description_short: "End-of-life inventory covers some asset types but leaves gaps, meaning EOL exposure in untracked categories is invisible."
description_long: "A partial EOL inventory provides incomplete risk visibility. Asset types or environments not covered by the inventory may contain EOL software that is entirely unaccounted for in risk assessments, audit reports, and migration planning. Common gaps include network devices, cloud workloads, container base images, and legacy appliances. Regulatory frameworks require comprehensive asset visibility: NIST SP 800-53 CM-8 mandates an inventory of all system components; PCI DSS Req 12.3.4 requires that hardware and software are reviewed at least once every 12 months to confirm they continue to receive security fixes. Gaps in EOL inventory translate directly to gaps in remediation planning."
frameworks:
  - id: "NIST SP 800-53 CM-8"
    text: "System Component Inventory — maintain a complete inventory including EOL status for all components"
  - id: "PCI DSS Req 12.3.4"
    text: "Hardware and software must be reviewed at least annually to confirm continued security patch availability"
  - id: "CIS Control 2"
    text: "Inventory and Control of Software Assets — track all software including EOL status across all environments"
industry_overlays:
  healthcare:
    weight_multiplier: 1.4
  financial:
    weight_multiplier: 1.3
  government:
    weight_multiplier: 1.4
  manufacturing:
    weight_multiplier: 1.3
  energy:
    weight_multiplier: 1.4
  education:
    weight_multiplier: 1.2
  default:
    weight_multiplier: 1.0
remediation_plain: "Expand your EOL inventory to cover all asset types — servers, workstations, network devices, cloud workloads, container base images, and appliances. What you do not track, you cannot plan to migrate."
remediation_technical: "Extend your asset inventory process to cover all asset classes. Use automated discovery tools (CMDB integration, cloud CSPM, network scanning) to identify asset types currently excluded from EOL tracking. Cross-reference all discovered assets against vendor EOL lifecycle databases (endoflife.date, vendor advisory feeds). Update EOL status in your CMDB on a quarterly basis. Assign ownership for each asset class to ensure no coverage gaps persist."
