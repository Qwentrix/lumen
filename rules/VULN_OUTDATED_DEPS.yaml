id: VULN_OUTDATED_DEPS
domain: vulnerabilities
severity: high
default_weight: 0.75
detect:
  questionnaire:
    - Q-VULN-002 == no_scanning
title: "No dependency vulnerability scanning"
description_short: "Software dependencies are not scanned for known CVEs."
description_long: "Running unscanned third-party dependencies exposes applications to exploitation via known CVEs. Supply-chain attacks increasingly target open-source libraries; without automated scanning, vulnerable packages may persist for months."
frameworks:
  - id: "NIST CSF ID.RA-1"
    text: "Asset vulnerabilities are identified and documented"
  - id: "OWASP Top 10 A06:2021"
    text: "Vulnerable and Outdated Components"
industry_overlays:
  technology:
    weight_multiplier: 1.4
  it_services:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Integrate a dependency scanner such as Dependabot, Snyk, or OWASP Dependency-Check into your CI pipeline."
remediation_technical: "Enable Dependabot or Renovate on all repositories. Add SCA tooling (Snyk/Trivy) as a CI gate that fails builds with CVSS >= 9 unfixed findings. Track your SBOM in a central inventory."
