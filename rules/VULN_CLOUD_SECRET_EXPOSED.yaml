id: VULN_CLOUD_SECRET_EXPOSED
domain: vulnerabilities
severity: critical
default_weight: 0.95
detect:
  questionnaire:
    - Q-VULN-DD-020 == hardcoded_or_unknown
title: "Cloud credentials hardcoded in code or configuration files"
description_short: "API keys, cloud credentials, or service account secrets are hardcoded in code or config files, or their storage location is unknown."
description_long: "Hardcoded credentials in source code, configuration files, or infrastructure templates represent one of the most commonly exploited vulnerabilities in cloud environments. Once a repository is accidentally made public, shared externally, or cloned to a developer machine, exposed credentials provide direct access to cloud infrastructure, databases, and services. Attackers continuously scan GitHub, GitLab, and public CI logs for exposed secrets. NIST SSDF (SP 800-218) PW.7.1 explicitly prohibits hardcoded credentials. The unknown status is equally concerning — it means there is no visibility into whether secrets are properly protected. This finding warrants immediate action."
frameworks:
  - id: "NIST SP 800-218 PW.7.1"
    text: "SSDF — review software for credentials, secrets, and other sensitive data hardcoded in source"
  - id: "CIS Control 4.4"
    text: "Use unique passwords — do not embed credentials in scripts, source code, or configuration files"
  - id: "OWASP Top 10 A07:2021"
    text: "Identification and Authentication Failures — includes hardcoded credentials"
  - id: "PCI DSS Req 8.2.1"
    text: "All user and system credentials must be individually managed and never hardcoded"
industry_overlays:
  financial:
    weight_multiplier: 1.5
  healthcare:
    weight_multiplier: 1.5
  government:
    weight_multiplier: 1.5
  technology:
    weight_multiplier: 1.4
  it_services:
    weight_multiplier: 1.4
  retail:
    weight_multiplier: 1.4
  default:
    weight_multiplier: 1.0
remediation_plain: "Immediately audit all source code repositories and configuration files for hardcoded secrets. Rotate any exposed credentials right away. Implement a secrets manager so that credentials are never stored in code."
remediation_technical: "Run truffleHog, GitLeaks, or detect-secrets across all repositories to identify any committed secrets. Rotate all discovered credentials immediately and revoke the old values. Migrate all secrets to a secrets manager (AWS Secrets Manager, HashiCorp Vault, Azure Key Vault, or equivalent). Implement pre-commit hooks and CI pipeline checks to prevent future hardcoded secrets. Enable GitHub Secret Scanning or GitLab Secret Detection. Review CloudTrail for any unauthorized API calls made with potentially exposed credentials."
