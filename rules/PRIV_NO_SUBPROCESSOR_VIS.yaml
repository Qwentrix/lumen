id: PRIV_NO_SUBPROCESSOR_VIS
domain: privacy
severity: medium
default_weight: 0.55
detect:
  questionnaire:
    - Q-PRIV-042 == no_visibility
    - Q-PRIV-042 == partial
    - Q-PRIV-DD-041 == no_requirement
title: "No visibility into sub-processors used by data processors — fourth-party risk unmanaged"
description_short: "The organization does not know which sub-processors its processors engage to handle personal data, and processor contracts do not require advance notification or approval before new sub-processors are added."
description_long: "GDPR Art. 28(2) requires processors to obtain prior specific or general written authorization from the controller before engaging sub-processors, and to flow down the same data protection obligations to those sub-processors. Without sub-processor visibility, the controller cannot: assess whether sub-processors meet GDPR standards, verify that sub-processor DPAs exist, ensure cross-border transfer mechanisms extend to sub-processor locations, or respond accurately to DSARs about where data has been shared. Where processors can add sub-processors freely without notification (Q-PRIV-DD-041 == no_requirement), personal data may be shared with unknown third parties in unknown jurisdictions at any time. This is a common source of unlawful cross-border transfers discovered only during breach investigations."
frameworks:
  - id: "GDPR Art. 28(2)"
    text: "Processor must obtain controller authorization before engaging sub-processors — controller must be notified of changes"
  - id: "GDPR Art. 28(4)"
    text: "Sub-processor obligations — same data protection obligations must be imposed on sub-processors"
  - id: "ISO 27018 §6"
    text: "Cloud customers must know which sub-processors handle their personal data and in which countries"
  - id: "CCPA §1798.140"
    text: "Service providers must not share personal information with third parties without authorization"
  - id: "NIST Privacy Framework PR.AT-P"
    text: "Third-party and fourth-party privacy practices are identified and assessed"
industry_overlays:
  healthcare:
    weight_multiplier: 1.5
  financial:
    weight_multiplier: 1.4
  legal:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.4
  technology:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Require every processor to tell you who their sub-processors are and to notify you before adding new ones. You need to know where your data goes beyond the first level of your vendor relationships."
remediation_technical: "1. Update all DPAs to include: a requirement for processors to maintain and publish a sub-processor list; an obligation to notify the controller before adding or replacing sub-processors (30 days' advance notice recommended); controller's right to object to new sub-processors. 2. Collect current sub-processor lists from all critical processors and review for data locations and transfer mechanisms. 3. Build a sub-processor register mapping: processor → sub-processors → countries → data categories → transfer mechanism. 4. Review sub-processor lists annually and verify that transfer mechanisms (SCCs, adequacy) extend to sub-processor locations. 5. Exercise the right to object when a new sub-processor raises compliance concerns — document the process and outcome."
