id: COMP_ACCESS_REVIEW_INFREQUENT
domain: compliance
severity: medium
default_weight: 0.45
detect:
  questionnaire:
    - Q-COMP-012 == ad_hoc
title: "User access reviews are ad hoc and infrequent"
description_short: "Access rights are reviewed on an ad hoc basis with no fixed schedule, creating risk of privilege accumulation."
description_long: "Without a regular access review cadence, user permissions accumulate over time — particularly when roles change or employees leave. Stale access grants are a primary vector for insider threat and lateral movement following an external compromise. HIPAA 164.312(a)(1) requires access management procedures, PCI DSS Req 7.2.3 requires periodic reviews, ISO 27001 A.9.2.5 requires formal access reviews, and SOC 2 CC6.3 requires access modifications to be removed promptly. Ad hoc reviews mean that until someone notices, over-privileged accounts remain exploitable. Annual or quarterly formal reviews are the minimum accepted standard."
frameworks:
  - id: "HIPAA 164.312(a)(1)"
    text: "Access control — establish procedures for granting and reviewing access"
  - id: "PCI DSS Req 7.2.3"
    text: "Privileges assigned to individuals based on job classification and function — periodic review"
  - id: "ISO 27001 A.9.2.5"
    text: "Review of user access rights"
  - id: "SOC 2 CC6.3"
    text: "Access modifications removed in timely manner when no longer authorised"
industry_overlays:
  healthcare:
    weight_multiplier: 1.4
  financial:
    weight_multiplier: 1.4
  government:
    weight_multiplier: 1.3
  legal:
    weight_multiplier: 1.3
  default:
    weight_multiplier: 1.0
remediation_plain: "Establish a formal access review schedule — at minimum annually, quarterly for privileged accounts. Assign a named owner for each review cycle and document results."
remediation_technical: "Implement recurring access certification campaigns in your IdP (Okta, Entra ID, SailPoint, Saviynt). Define review frequency by risk tier: quarterly for admin/privileged accounts, annually for standard users. Integrate with HR systems for triggered reviews on role change and departure. Retain certification records as compliance evidence for SOC 2 CC6.3 and PCI DSS 7.2.3."
