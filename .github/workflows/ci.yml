name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go-test:
    name: ci/go-test
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------------------
      # Dual checkout: scanner repo into ./lumen/ and the lumen-scoring sibling
      # into ./lumen-scoring/ so the go.mod replace directive
      # (replace github.com/Qwentrix/lumen-scoring => ../lumen-scoring) resolves
      # correctly.  Pattern mirrors release.yml §Checkout.
      # -----------------------------------------------------------------------
      - name: Checkout lumen (scanner)
        uses: actions/checkout@v4
        with:
          path: lumen

      - name: Checkout lumen-scoring (replace dependency)
        uses: actions/checkout@v4
        with:
          repository: Qwentrix/lumen-scoring
          path: lumen-scoring
          # Tracking lumen-scoring@main until v0.1.0 is tagged; pin to the tag/SHA
          # once published.  Note: the embedded-content source_sha in
          # internal/rules/data/content-snapshot.meta.json is the MICELIUM repo
          # SHA — a different repository entirely, not the lumen-scoring SHA.
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: lumen/go.sum

      - name: Download dependencies
        working-directory: lumen
        run: go mod download

      - name: Run tests
        working-directory: lumen
        run: go test -race -count=1 ./...

  lint:
    name: ci/lint
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------------------
      # Dual checkout: same pattern as go-test — lumen-scoring must be present
      # as a sibling so golangci-lint can resolve the replace directive.
      # -----------------------------------------------------------------------
      - name: Checkout lumen (scanner)
        uses: actions/checkout@v4
        with:
          path: lumen

      - name: Checkout lumen-scoring (replace dependency)
        uses: actions/checkout@v4
        with:
          repository: Qwentrix/lumen-scoring
          path: lumen-scoring
          # Tracking lumen-scoring@main until v0.1.0 is tagged; pin to the tag/SHA
          # once published.  Note: the embedded-content source_sha in
          # internal/rules/data/content-snapshot.meta.json is the MICELIUM repo
          # SHA — a different repository entirely, not the lumen-scoring SHA.
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: lumen/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: lumen

  # -------------------------------------------------------------------------
  # Apache 2.0 license-header gate (AC-97-13 / LU-1 acceptance requirement).
  # Every .go file under cmd/ and internal/ must start with an Apache 2.0
  # SPDX identifier or the canonical Apache copyright header comment.
  # New files that omit the header will fail CI.
  # -------------------------------------------------------------------------
  license-headers:
    name: ci/license-headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Apache 2.0 license headers on .go source files
        run: |
          set -euo pipefail
          MISSING=()
          while IFS= read -r -d '' f; do
            # Accept either the SPDX short-form or the canonical Apache header.
            if ! grep -qE \
              'SPDX-License-Identifier: Apache-2\.0|Licensed under the Apache License' \
              "$f"; then
              MISSING+=("$f")
            fi
          done < <(find cmd internal -name '*.go' -print0)

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "ERROR: The following .go files are missing Apache 2.0 license headers:"
            printf '  %s\n' "${MISSING[@]}"
            echo ""
            echo "Add one of the following to the top of each file:"
            echo "  // SPDX-License-Identifier: Apache-2.0"
            echo "  // Licensed under the Apache License, Version 2.0 ..."
            exit 1
          fi
          echo "All .go files have Apache 2.0 license headers."

  # -------------------------------------------------------------------------
  # No-default-network-call gate (AC-97-12 / Design Principle 4).
  # The scanner must make zero outbound network calls during a default
  # (non-hybrid) `lumen scan` run.  This job:
  #   1. Builds the scanner binary.
  #   2. Runs `lumen scan` under a network-namespace sandbox (unshare/firejail) OR
  #      a Go test that asserts TestNoDefaultNetworkCalls.
  #   3. Fails CI if any outbound call is detected.
  #
  # In LU-1 the probe stubs make no network calls, so the test passes trivially.
  # The gate exists to prevent LU-4 probe work from accidentally adding calls.
  # -------------------------------------------------------------------------
  no-default-network-call:
    name: ci/no-default-network-call
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------------------
      # Dual checkout: scanner repo into ./lumen/ and the lumen-scoring sibling
      # into ./lumen-scoring/ so the go.mod replace directive
      # (replace github.com/Qwentrix/lumen-scoring => ../lumen-scoring) resolves
      # correctly.  Pattern mirrors release.yml §Checkout.
      # -----------------------------------------------------------------------
      - name: Checkout lumen (scanner)
        uses: actions/checkout@v4
        with:
          path: lumen

      - name: Checkout lumen-scoring (replace dependency)
        uses: actions/checkout@v4
        with:
          repository: Qwentrix/lumen-scoring
          path: lumen-scoring
          # Tracking lumen-scoring@main until v0.1.0 is tagged; pin to the tag/SHA
          # once published.  Note: the embedded-content source_sha in
          # internal/rules/data/content-snapshot.meta.json is the MICELIUM repo
          # SHA — a different repository entirely, not the lumen-scoring SHA.
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: lumen/go.sum

      - name: Build lumen binary
        working-directory: lumen
        run: go build -o lumen-ci ./cmd/lumen

      - name: Run TestNoDefaultNetworkCalls (plain)
        # HTTP-transport interceptor layer: any net/http call inside probes trips
        # an atomic counter and fails the test.  In LU-1 all probes are stubs so
        # this passes trivially; the gate prevents LU-4+ probe work from adding
        # accidental HTTP calls.
        working-directory: lumen
        run: go test -v -run TestNoDefaultNetworkCalls ./internal/netcheck/...

      - name: Run TestNoDefaultNetworkCalls (network-namespace isolation)
        # Raw-syscall layer: run the same test inside a network namespace that
        # has no interfaces (only lo).  Any raw net.Dial / net.LookupHost
        # syscall fails with ENETUNREACH, which surfaces as a probe error caught
        # by the test's r.err != nil check.
        # --map-root-user maps the current UID to root inside the namespace so
        # unshare succeeds on ubuntu-latest without requiring true root.
        # Together with the plain run above, these two layers form the complete
        # zero-network gate documented in SCANNER_MANIFEST.md §Zero-Network CI Gates.
        working-directory: lumen
        run: >
          sudo unshare --net --map-root-user
          go test -v -run TestNoDefaultNetworkCalls ./internal/netcheck/...

  # -------------------------------------------------------------------------
  # Version stub smoke test (AC-97-10).
  # -------------------------------------------------------------------------
  version-smoke:
    name: ci/version-smoke
    runs-on: ubuntu-latest
    steps:
      # -----------------------------------------------------------------------
      # Dual checkout: scanner repo into ./lumen/ and the lumen-scoring sibling
      # into ./lumen-scoring/ so the go.mod replace directive
      # (replace github.com/Qwentrix/lumen-scoring => ../lumen-scoring) resolves
      # correctly.  Pattern mirrors release.yml §Checkout.
      # -----------------------------------------------------------------------
      - name: Checkout lumen (scanner)
        uses: actions/checkout@v4
        with:
          path: lumen

      - name: Checkout lumen-scoring (replace dependency)
        uses: actions/checkout@v4
        with:
          repository: Qwentrix/lumen-scoring
          path: lumen-scoring
          # Tracking lumen-scoring@main until v0.1.0 is tagged; pin to the tag/SHA
          # once published.  Note: the embedded-content source_sha in
          # internal/rules/data/content-snapshot.meta.json is the MICELIUM repo
          # SHA — a different repository entirely, not the lumen-scoring SHA.
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: lumen/go.sum

      - name: Build and check lumen --version
        working-directory: lumen
        run: |
          go build -o lumen-ci ./cmd/lumen
          ./lumen-ci --version
          ./lumen-ci version

  trivy:
    name: ci/trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
